<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV Field v2 — paddy, rice and straw</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#d6d7d4;color:#1c1d1b;font-family:"IBM Plex Mono",ui-monospace,monospace}
  a{color:#1f6f6c}a:hover{color:#0f4846}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{height:100vh}
  #busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 13px "IBM Plex Mono",monospace;color:#3b3d3a;pointer-events:none}
</style>
</head>
<body>
<three-d-stage name="Env_Field_v2" background="#d6d7d4"></three-d-stage>
<div id="busy">Planting the paddy pack…</div>
<script src="three-d-stage.js"></script>
<script type="module">
import { THREE, V3, prepStage, layoutRows, setupViewer } from './env_common.js';
import * as F from './env_field_lib.js';
const stage = document.querySelector('three-d-stage');
await stage.ready;
try { await document.fonts.load('700 40px "IBM Plex Sans Condensed"'); await document.fonts.load('600 12px "IBM Plex Mono"'); } catch (e) {}
prepStage(stage);
const busy = document.getElementById('busy'), tick = m => new Promise(r => { busy.textContent = m; const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });

const specs = {}, root = new THREE.Group(); root.name = 'EV_FieldPack';
const ROW = [1500, 3500], SEG = (h, lo = .85, wLo = 5.6, dLo = 7.6) => [[wLo, 6.4], [h * lo, h], [dLo, 8]];
const build = [
  ['Seedlings', () => F.riceRow('seedling', 'A', 11), SEG(1, .75, 6.4, 8), ROW], [null, () => F.riceRow('seedling', 'B', 12), SEG(1, .75, 6.4, 8), ROW],
  ['Tillering rice', () => F.riceRow('growing', 'A', 21), SEG(2.2, .85, 6.4, 8), ROW], [null, () => F.riceRow('growing', 'B', 22), SEG(2.2, .85, 6.4, 8), ROW],
  ['Heading rice', () => F.riceRow('heading', 'A', 31), SEG(3.2), ROW], [null, () => F.riceRow('heading', 'B', 32), SEG(3.2), ROW],
  ['Ripe rice', () => F.riceRow('ripe', 'A', 41), SEG(3.4, .9), ROW], [null, () => F.riceRow('ripe', 'B', 42), SEG(3.4, .9), ROW],
  ['Stubble', () => F.riceRow('stubble', 'A', 51), SEG(1.2), ROW], [null, () => F.riceRow('stubble', 'B', 52), SEG(1.2), ROW],
  ['Burnt stubble', () => F.riceRow('burnt', 'A', 61), SEG(.8, .75, 6.0, 7.9), ROW],
  ['Prepared row', () => F.preparedRow('A', 71), SEG(.4, .75, 6.4, 8), ROW],
  ['Sheaves', () => F.strawSheaf('A', 81), [[2.0, 2.4], [4.2, 4.8], [2.0, 2.4]], [1200, 2500]], [null, () => F.strawSheaf('B', 82), [[2.0, 2.4], [4.2, 4.8], [2.0, 2.4]], [1200, 2500]], [null, () => F.strawSheaf('C', 83), [[2.0, 2.4], [4.2, 4.8], [2.0, 2.4]], [1200, 2500]],
  [null, () => F.strawSheafBurnt('A', 84), [[2.0, 2.4], [2.2, 2.5], [2.0, 2.4]], [1200, 2500]],
  ['Windrow, bale, bund', () => F.strawWindrow('A', 91), [[3.6, 4], [.8, 1], [7.9, 8]], ROW], [null, () => F.strawBale('A', 92), [[2.8, 3], [1.6, 1.8], [1.85, 2]], [800, 2500]], [null, () => F.bund('A', 93), [[2.0, 2.2], [1.5, 1.7], [7.9, 8]], [800, 3500]],
  ['Factory items', () => F.itemWetStraw('A', 101), [[.9, 1.3], [.4, 1.1], [.4, 1.3]], [300, 1200]], [null, () => F.itemDryStraw('A', 102), [[.9, 1.3], [.4, 1.1], [.4, 1.3]], [300, 1200]],
  [null, () => F.itemShredded('A', 103), [[1, 1.3], [.8, 1.1], [1, 1.3]], [300, 1200]], [null, () => F.itemPelletCrate('A', 104), [[1.3, 1.5], [1.2, 1.4], [1.3, 1.5]], [300, 1200]],
  [null, () => F.itemBiochar('A', 105), [[.9, 1.3], [.9, 1.1], [.7, 1.3]], [300, 1200]], [null, () => F.itemMushrooms('A', 106), [[1.1, 1.3], [.3, 1.1], [1.1, 1.3]], [300, 1200]],
];
await tick('Painting the rice atlas…'); F.riceAtlas();
for (const [label, fn, [w, h, d], budget] of build) { if (label) await tick(`Building ${label.toLowerCase()}…`); let g; try { g = fn(); } catch (e) { console.error('build failed', label, e.message, e.stack); busy.textContent = 'failed: ' + e.message; throw e; } root.add(g); specs[g.name] = { w, h, d, budget }; }
const N = n => 'EV_' + n;
layoutRows(root, [
  ['RiceSeedling_A', 'RiceSeedling_B', 'RiceGrowing_A', 'RiceGrowing_B', 'RiceHeading_A', 'RiceHeading_B', 'RiceRipe_A', 'RiceRipe_B'].map(N),
  ['PreparedRow_A', 'Stubble_A', 'Stubble_B', 'StubbleBurnt_A', 'StrawWindrow_A', 'Bund_A', 'StrawBaleSquare_A'].map(N),
  ['StrawSheaf_A', 'StrawSheaf_B', 'StrawSheaf_C', 'StrawSheafBurnt_A', 'ItemWetStraw_A', 'ItemDryStraw_A', 'ItemShreddedStraw_A', 'ItemPelletCrate_A', 'ItemBiochar_A', 'ItemMushrooms_A'].map(N),
], 3);
await tick('Laying out the test field…');
const { rows } = setupViewer(stage, root, { title: 'EV FIELD · v2', specs, filename: 'Env_Field_v2.glb', focusDir: [.55, .55, -1] });
root.traverse(o => { if (o.isMesh && /_Water$/.test(o.name)) o.castShadow = false; });

/* test field (preview only, not exported) */
const scene = stage._scene, byName = Object.fromEntries(root.children.map(g => { const c = g.clone(); c.position.set(0, 0, 0); return [g.name, c]; }));
const field = F.buildTestField(byName); scene.add(field);
stage._ground.scale.set(8, 8, 1); stage._ground.material.color.set(0xa39a78);

/* late-afternoon dry-season light */
const key = stage._key; key.color.set(0xffd6a6); key.intensity = 3.1; key.shadow.mapSize.set(4096, 4096); key.shadow.map?.dispose(); key.shadow.map = null; key.shadow.bias = -.0004; key.shadow.normalBias = .03; scene.add(key.target);
scene.traverse(o => { if (o.isHemisphereLight) { o.color.set(0xcfdcea); o.groundColor.set(0x8a7656); o.intensity = .75; } });
const SUN = new V3(-.78, .4, -.48).normalize();
const sun = (tgt, R) => { key.position.copy(tgt).addScaledVector(SUN, 300); key.target.position.copy(tgt); const c = key.shadow.camera; c.left = c.bottom = -R; c.right = c.top = R; c.near = 100; c.far = 500; c.updateProjectionMatrix(); };
sun(new V3(0, 0, 0), 60);
const cam = stage._camera, ctl = stage._controls, PX = field.userData.plotX, Z0 = F.FIELD.z0;
const look = (p, t, R, fog) => { cam.position.copy(p); ctl.target.copy(t); cam.near = .1; cam.far = 3000; cam.updateProjectionMatrix(); ctl.update(); sun(t, R); scene.fog = fog ? new THREE.Fog(0xd8d3c6, fog[0], fog[1]) : null; scene.background = fog ? new THREE.Color(0xd8d3c6) : null; };
const SH = {
  eye: () => look(new V3(PX.ripe - 21, 5, Z0 - 3.2), new V3(PX.ripe + 4, 1.6, Z0 + 26), 80, [70, 420]),
  aerial: () => look(new V3(-40, 78, Z0 - 58), new V3(-40, 0, Z0 + 20), 140, [200, 900]),
  ripe: () => look(new V3(PX.ripe + 8.6, 3.9, Z0 + 15.5), new V3(PX.ripe + 4.5, 2.7, Z0 + 20), 14, [60, 400]),
  stubble: () => look(new V3(PX.stubble - 2, 4.2, Z0 + 1), new V3(PX.stubble - 7, 1.2, Z0 + 14), 30, [60, 400]),
  burnt: () => look(new V3(PX.burnt + 6, 4.6, Z0 + 2), new V3(PX.burnt + 1, .3, Z0 + 14), 30, [60, 400]),
  tiles: () => look(new V3(PX.growing - 2, 7, Z0 + 2), new V3(PX.growing + 4.5, .8, Z0 + 20), 40, [80, 400]),
};
const contact0 = window.__contact; window.__contact = () => { scene.fog = null; scene.background = null; sun(new V3(0, 0, 0), 60); contact0(); };
const focus0 = window.__focus; window.__focus = n => { scene.fog = null; scene.background = null; const g = root.getObjectByName(n), b = new THREE.Box3().setFromObject(g); sun(b.getCenter(new V3()), 12); focus0(n); };
window.__shots = SH;

/* panel: tiling note + field views */
const panel = document.getElementById('evp'), body = panel.querySelector('.body');
panel.querySelector('#evContact').onclick = () => window.__contact();
panel.querySelectorAll('tr.as').forEach(tr => tr.onclick = () => window.__focus(tr.dataset.n));
const tileNames = root.children.map(g => g.name).filter(n => /Rice|Stubble|PreparedRow|Windrow|Bund/.test(n));
const tileRows = tileNames.map(n => { const g = root.getObjectByName(n), pos = g.position.clone(); g.position.set(0, 0, 0); g.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(g, true); g.position.copy(pos); g.updateMatrixWorld(true);
  const lim = /Windrow/.test(n) ? 2.0 : /Bund/.test(n) ? 1.1 : 3.2, ok = b.min.z >= -4.001 && b.max.z <= 4.001 && b.min.x >= -lim - .001 && b.max.x <= lim + .001 && b.min.y >= -.001; return { n, b, ok }; });
const seam = c => { const W = c.width, H = c.height, d = c.getContext('2d').getImageData(0, 0, W, H).data; let e = 0, r = 0; for (let i = 0; i < W; i += 2) for (let k = 0; k < 3; k++) { e += Math.abs(d[i * 4 + k] - d[((H - 1) * W + i) * 4 + k]); r += Math.abs(d[i * 4 + k] - d[(W + i) * 4 + k]); } return e / Math.max(1, r); };
const seams = Object.entries(F.seamCanvases).map(([k, c]) => [k, seam(c)]);
const allTile = tileRows.every(r => r.ok) && seams.every(s => s[1] < 1.6);
const sec = document.createElement('div'); sec.className = 'sec';
sec.innerHTML = `<div class="lab">Field views</div><div class="row">${Object.keys(SH).map(k => `<button data-v="${k}">${k}</button>`).join('')}</div>`;
const sec2 = document.createElement('div'); sec2.className = 'sec';
sec2.innerHTML = `<div class="lab">Tiling along Z (8-stud repeat)</div><table>
  ${tileRows.map(r => `<tr><td>${r.n.replace(/^EV_/, '')}</td><td class="r">z ${r.b.min.z.toFixed(2)}…${r.b.max.z.toFixed(2)}</td><td class="r ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'}</td></tr>`).join('')}
  <tr><td>Hill grid pitch inside / across seam</td><td class="r">${F.HILL_PITCH.toFixed(2)} / ${F.HILL_PITCH.toFixed(2)}</td><td class="r ok">✓</td></tr>
  ${seams.map(([k, s]) => `<tr><td>${k} texture periodic in Z (edge Δ ${s.toFixed(2)}×)</td><td></td><td class="r ${s < 1.6 ? 'ok' : 'bad'}">${s < 1.6 ? '✓' : '✗'}</td></tr>`).join('')}
  <tr><td colspan="3" style="color:#5a5c58;padding-top:4px">Ground, bund and windrow surfaces use Z-periodic noise with analytic normals; plants are squashed (not clipped) to stay inside ±4.00. Test field: ${F.STAGE_ORDER.length} plots × 4 rows × 40 studs, preview only — Export GLB contains the ${root.children.length} EV_ assets.</td></tr></table>`;
body.insertBefore(sec2, body.children[2]); body.insertBefore(sec, body.children[1]);
sec.querySelectorAll('button').forEach(b => b.onclick = () => SH[b.dataset.v]());
window.__tiling = { ok: allTile, rows: tileRows.map(r => ({ n: r.n, ok: r.ok, z: [r.b.min.z, r.b.max.z], x: [r.b.min.x, r.b.max.x] })), seams };
busy.remove();
SH.eye();
</script>
</body>
</html>
