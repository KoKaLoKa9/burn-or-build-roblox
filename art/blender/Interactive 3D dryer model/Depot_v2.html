<body>
<three-d-stage name="Depot_v2" background="#d6d7d4"></three-d-stage>
<div id="busy">Building the collection point and buyer depot…</div>
<aside id="panel">
  <header><h1>DEPOTS · v2</h1><button class="tog" id="minBtn">hide</button></header>
  <div class="body">
    <div class="sec"><div class="lab">Building</div><div class="row" id="pick"></div></div>
    <div class="sec"><div class="lab">Views</div><div class="row" id="views"></div></div>
    <div class="sec"><div class="lab">Animation preview</div><div class="row">
      <button id="aFill">Fill CP_Straw</button><button id="aBeacon">Light CP_Emissive</button><button id="aShut">Raise BD_Shutters</button>
    </div></div>
    <div class="sec"><div class="row"><button id="glbBtn" class="primary">Export GLB</button><button id="glbAll">Export all</button><span id="glbMsg" style="align-self:center;color:#5a5c58"></span></div></div>
    <div class="sec"><div class="lab">Frame (1 unit = 1 stud)</div><div id="frame"></div></div>
    <div class="sec"><div class="lab">Checks (both + link)</div><table id="checks"></table></div>
    <div class="sec"><div class="lab">Groups · triangles</div><table id="tris"></table></div>
  </div>
</aside>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const renderer = stage._renderer, scene = stage._scene, cam = stage._camera, ctl = stage._controls;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
try { await Promise.all([document.fonts.load('700 40px "IBM Plex Sans Condensed"'), document.fonts.load('600 40px "IBM Plex Mono"')]); } catch (e) {}
const L = await import('./dp_machines.js');
const V3 = THREE.Vector3, DEG = Math.PI / 180;
const ids = Object.keys(L.SPEC), roots = {};
for (const id of ids) roots[id] = L.BUILD[id]();
{ const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: new THREE.Color(.42, .43, .44), side: THREE.BackSide })));
  const pn = (w, h, c, p, r) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c, c, c * .97), side: THREE.DoubleSide })); m.position.set(...p); m.rotation.set(...r); env.add(m); };
  pn(30, 30, 4, [0, 14, 0], [Math.PI / 2, 0, 0]); pn(20, 10, 1.6, [28, 6, 10], [0, -Math.PI / 2, 0]); pn(20, 10, 1.0, [-28, 6, -8], [0, Math.PI / 2, 0]);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, .04).texture; scene.environmentIntensity = .6; }
const holder = new THREE.Group(); holder.name = 'Viewer'; stage.setObject(holder);
stage._ground.material = new THREE.MeshStandardMaterial({ color: 0xa9aaa6, roughness: .95 }); stage._ground.scale.setScalar(60); stage._ground.position.y = 0;
const key = stage._key; key.intensity = 2.5; key.shadow.mapSize.set(4096, 4096); key.shadow.map?.dispose(); key.shadow.map = null; key.shadow.bias = -.0003; key.shadow.normalBias = .02; scene.add(key.target);
function sun(t, R) { key.target.position.copy(t); key.position.copy(t).add(new V3(22, 40, 26)); const c = key.shadow.camera; c.left = c.bottom = -R; c.right = c.top = R; c.near = 1; c.far = 300; c.updateProjectionMatrix(); }
document.getElementById('busy').remove();

/* ---------- checks ---------- */
const PT_ = .3, E = 1e-3, tri = m => (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3;
const wbox = o => new THREE.Box3().setFromObject(o, true);
function verts(o, fn) { o.updateMatrixWorld(true); const v = new V3(); o.traverse(m => { if (!m.isMesh) return; const p = m.geometry.attributes.position; for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld); fn(v, m); } }); }
const info = {}, checks = [];
const ck = (id, name, ok, note = '') => checks.push({ id, name, ok, note });
for (const id of ids) {
  const R = roots[id], S = L.SPEC[id], pf = S.pfx; R.position.set(0, 0, 0); R.updateMatrixWorld(true);
  const b = wbox(R), size = b.getSize(new V3()), gr = R.children.map(c => ({ name: c.name, tris: c.children.reduce((s, m) => s + tri(m), 0) }));
  const total = gr.reduce((s, g) => s + g.tris, 0); let maxMesh = 0; R.traverse(m => { if (m.isMesh) maxMesh = Math.max(maxMesh, tri(m)); });
  info[id] = { b, size, gr, total, maxMesh };
  const [W, H, D] = S.s;
  ck(id, `Inside ${W} × ${H} × ${D}: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`, b.min.x >= -W / 2 - E && b.max.x <= W / 2 + E && b.min.z >= -D / 2 - E && b.max.z <= D / 2 + E && b.max.y <= H + E);
  ck(id, 'Underside on y = 0, origin bottom centre', Math.abs(b.min.y) < E);
  ck(id, `Triangles ${S.tri[0] / 1000}k–${S.tri[1] / 1000}k (${total.toLocaleString()})`, total >= S.tri[0] && total <= S.tri[1]);
  ck(id, `Every mesh < 20k (max ${maxMesh.toLocaleString()})`, maxMesh < 20000);
  const names = R.children.map(c => c.name), missing = S.groups.filter(g => !names.includes(pf + g)), extra = names.filter(n => !S.groups.map(g => pf + g).includes(n));
  let meshNames = true; R.children.forEach(c => c.children.forEach(m => { if (!m.isMesh || !m.name.startsWith(c.name + '_')) meshNames = false; }));
  ck(id, 'Groups as specified, meshes <Group>_<Part>', !missing.length && !extra.length && meshNames, missing.concat(extra).join(' '));
  let bad = 0; R.traverse(o => { if (o.isLight || o.isCamera || /Helper/.test(o.type) || o.isLine) bad++; }); ck(id, 'No lights / cameras / helpers', bad === 0);
  for (const P of S.ports) { let other = 0, allowOut = 0, who = new Set();
    verts(R, (v, m) => { const g = m.parent.name; if (v.y <= PT_ + .02 || v.y > 3 + 1.5) return; if ((v.x - P.x) * P.n < -.6) return; const dz = Math.abs(v.z - P.zc); if (dz > 1.25 + 1.5) return;
      if (g === P.allow) { if (dz > 1.25 + E || v.y > 3 + E) { allowOut++; who.add(g); } } else { other++; who.add(g); } });
    ck(id, `${P.label}: 2.5 × 3 opening at x = ${P.x}, z = ${P.zc} clear, nothing within 1.5 on that face`, !other && !allowOut, (other + allowOut) ? [...who].join('/') + ' ' + (other + allowOut) : ''); }
  const gb = R.children.filter(c => c.children.length).map(c => ({ n: c.name, b: wbox(c) })), floating = [];
  gb.forEach(g => { if (g.b.min.y <= .03) return; const e = g.b.clone().expandByScalar(.03); if (!gb.some(o => o !== g && e.intersectsBox(o.b))) floating.push(g.n); });
  ck(id, 'No floating groups (each touches the ground or another group)', !floating.length, floating.join(' '));
  { let sunk = 0, who = new Set(); verts(R, (v, m) => { if (m.parent.name !== S.pad && v.y < PT_ - .002) { sunk++; who.add(m.parent.name); } }); ck(id, 'Nothing sinks into the pad (all parts y ≥ 0.30)', !sunk, sunk ? [...who].join('/') + ' ' + sunk : ''); }
  const hits = []; for (const [g, mn, mx] of S.solids) { const bx = new THREE.Box3(new V3(...mn), new V3(...mx)).expandByScalar(-.06); let n = 0, who = new Set();
    verts(R, (v, m) => { const pg = m.parent.name; if (pg === g || /_(Glass|Emissive|Details)$/.test(pg)) return; if (bx.containsPoint(v)) { n++; who.add(pg); } }); if (n) hits.push(g + '←' + [...who].join('/') + ' ' + n); }
  if (S.solids.length) ck(id, 'No clipping into solid volumes (' + S.solids.map(s => s[0]).join(', ') + ')', !hits.length, hits.join('; '));
}
{ const R = roots.CollectionPoint, Rf = R.getObjectByName('CP_Roof'); let top = -1; verts(Rf, v => top = Math.max(top, v.y)); let all = -1; verts(R, v => all = Math.max(all, v.y));
  ck('CollectionPoint', `Roof ridge y = ${top.toFixed(3)} (= 10), nothing higher (${all.toFixed(3)})`, Math.abs(top - 10) < .005 && all <= 10 + E);
  const St = R.getObjectByName('CP_Straw'), sb = wbox(St), o = St.getWorldPosition(new V3());
  ck('CollectionPoint', `CP_Straw origin on hopper floor (${o.toArray().map(v => v.toFixed(2)).join(', ')}), bottom at origin, full ${(sb.max.y - o.y).toFixed(2)}`, Math.abs(sb.min.y - o.y) < .01);
  let ex = -9, ey = 0; verts(R.getObjectByName('CP_Belt'), v => { if (v.x > ex + E) { ex = v.x; ey = v.y; } else if (Math.abs(v.x - ex) < E) ey = Math.max(ey, v.y); }); ck('CollectionPoint', `Outgoing belt ends at x = ${ex.toFixed(3)} (belt top ${(1.75).toFixed(2)} over CV_PortOut lip)`, Math.abs(ex - 6) < E); }
{ const R = roots.BuyerDepot; [-8, 0, 8].forEach((zc, i) => { let mn = 9, my = -9; verts(R.getObjectByName('BD_Bays'), v => { if (Math.abs(v.z - zc) < 1.3 && v.x < -21.99) { mn = Math.min(mn, v.x); my = Math.max(my, v.y); } }); let gx = 9; verts(R.getObjectByName('BD_Bays'), v => { if (Math.abs(v.z - zc) < 1.3) gx = Math.min(gx, v.x); });
    ck('BuyerDepot', `Bay ${i + 1} roller conveyor ends at x = ${gx.toFixed(3)}, top y = ${my.toFixed(3)} (1.32)`, Math.abs(gx + 22) < E && Math.abs(my - 1.32) < .003);
    const S = R.getObjectByName('BD_Shutter' + (i + 1)), o = S.getWorldPosition(new V3()), sb = wbox(S); ck('BuyerDepot', `BD_Shutter${i + 1} origin on the top roll (${o.toArray().map(v => v.toFixed(2)).join(', ')})`, Math.abs(sb.max.y - .2 - o.y) < .01 && Math.abs(o.z - zc) < E); });
  let top = -1, who = ''; R.children.forEach(c => { const y = wbox(c).max.y; if (y > top) { top = y; who = c.name; } }); ck('BuyerDepot', `Tallest point ${top.toFixed(2)} ≤ 20 is ${who}`, who === 'BD_Silo' && top <= 20 + E); }
const texSet = new Set(); ids.forEach(id => roots[id].traverse(o => { if (!o.isMesh) return; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => ['map', 'normalMap', 'emissiveMap'].forEach(k => m[k] && texSet.add(m[k].source.uuid))); }));
ck('All', `Shared texture images across pack: ${texSet.size}`, true);
function renderChecks() { document.getElementById('checks').innerHTML = checks.map(c => `<tr><td><b>${c.id}</b> ${c.name}${c.note ? ` <span class="bad">${c.note}</span>` : ''}</td><td class="r ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'}</td></tr>`).join('');
  window.__dp = { okAll: checks.every(c => c.ok), fails: checks.filter(c => !c.ok).map(c => c.id + ': ' + c.name + ' ' + c.note), info: Object.fromEntries(ids.map(id => [id, { size: info[id].size.toArray().map(v => +v.toFixed(2)), min: info[id].b.min.toArray().map(v => +v.toFixed(2)), max: info[id].b.max.toArray().map(v => +v.toFixed(2)), total: info[id].total, groups: info[id].gr.map(g => [g.name, g.tris]) }])) }; }
renderChecks();

/* ---------- picker / readout / views ---------- */
let cur = null, link = null; const f2 = v => v.toFixed(2);
function show(id) { if (link) unlink(); holder.clear(); cur = id; roots[id].position.set(0, 0, 0); holder.add(roots[id]);
  document.querySelectorAll('#pick button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
  const I = info[id], S = L.SPEC[id];
  document.getElementById('frame').innerHTML = `<b>${id}</b> · prefix ${S.pfx}<br>size ${f2(I.size.x)} × ${f2(I.size.y)} × ${f2(I.size.z)} (limit ${S.s.join(' × ')})<br>min (${I.b.min.toArray().map(f2).join(', ')})<br>max (${I.b.max.toArray().map(f2).join(', ')})<br>origin bottom centre · +X east · −Z north<br>${S.ports.map(p => `${p.label}: x = ${p.x}, z = ${p.zc}, 2.5 × 3`).join('<br>')}${S.ridge ? '<br>roof ridge y = 10' : '<br>silo top ≤ 20'}`;
  document.getElementById('tris').innerHTML = I.gr.map(g => `<tr><td>${g.name}</td><td class="r">${g.tris.toLocaleString()}</td></tr>`).join('') + `<tr><td style="font-weight:600;padding-top:4px">Total</td><td class="r" style="font-weight:600;padding-top:4px">${I.total.toLocaleString()}</td></tr>`;
  view('Front ¾'); }
const pick = document.getElementById('pick'); ids.forEach(id => { const b = document.createElement('button'); b.textContent = id; b.dataset.id = id; b.onclick = () => show(id); pick.appendChild(b); });
const VW = {
  CollectionPoint: { 'Front ¾': [[13, 9, 17], [0, 3, 0], 10], 'Back ¾': [[-14, 10, -16], [0, 3, 0], 10], '60 studs': [[22, 8, 56], [0, 4, 0], 12], 'Close-up': [[1.0, 4.0, 4.6], [-1.6, .9, 0], 5] },
  BuyerDepot: { 'Front ¾': [[-46, 26, 40], [-2, 5, 0], 30], 'Back ¾': [[44, 28, -44], [2, 5, -4], 30], '60 studs': [[-48, 9, 38], [-2, 7, 0], 30], 'Close-up': [[-27.5, 4.2, 5.2], [-19, 1.9, 0], 8] } };
function view(k) {
  if (k === 'Link') return doLink(); if (k === 'Bay + port') return doLink('bay');
  if (link) show(cur); const [p, t, r] = VW[cur][k]; cam.position.set(...p); ctl.target.set(...t); cam.near = .05; cam.far = 1500; cam.updateProjectionMatrix(); ctl.update(); sun(new V3(...t), r); }
const vw = document.getElementById('views'); for (const k of ['Front ¾', 'Back ¾', '60 studs', 'Close-up', 'Link', 'Bay + port']) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => view(k); vw.appendChild(b); }
window.__show = show; window.__view = view;

/* ---------- link view: CV_ pieces from the conveyor kit ---------- */
function portMesh(o) { const C = { Float32Array, Uint16Array, Uint32Array, Uint8Array, Int16Array, Int32Array, Int8Array };
  const geo = new THREE.BufferGeometry(); for (const k in o.geometry.attributes) { const a = o.geometry.attributes[k]; geo.setAttribute(k, new THREE.BufferAttribute(new C[a.array.constructor.name](a.array), a.itemSize, a.normalized)); }
  if (o.geometry.index) { const ix = o.geometry.index.array; geo.setIndex(new THREE.BufferAttribute(new C[ix.constructor.name](ix), 1)); } o.geometry.groups.forEach(g => geo.addGroup(g.start, g.count, g.materialIndex)); return geo; }
const texCache = new Map();
function portTex(t, srgb) { if (!t || !t.image) return null; if (texCache.has(t.uuid)) return texCache.get(t.uuid); const img = t.image, c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0);
  const n = new THREE.CanvasTexture(c); n.wrapS = t.wrapS; n.wrapT = t.wrapT; n.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; n.anisotropy = 8; texCache.set(t.uuid, n); return n; }
const portMat = m => new THREE.MeshStandardMaterial({ color: m.color ? m.color.getHex() : 0xffffff, roughness: m.roughness ?? .6, metalness: m.metalness ?? 0, map: portTex(m.map, true), normalMap: portTex(m.normalMap, false), transparent: m.transparent, opacity: m.opacity, alphaTest: m.alphaTest, side: m.side, depthWrite: m.depthWrite, polygonOffset: m.polygonOffset, polygonOffsetFactor: m.polygonOffsetFactor, polygonOffsetUnits: m.polygonOffsetUnits });
let kitP = null;
function loadKit() { if (kitP) return kitP; kitP = new Promise(res => { const f = document.createElement('iframe'); f.src = 'Conveyor_v2.html'; f.style.cssText = 'position:fixed;left:-2000px;top:0;width:640px;height:480px;opacity:0;pointer-events:none'; document.body.appendChild(f);
  const t0 = performance.now(), poll = () => { try { const d = f.contentDocument, s = d.querySelector('three-d-stage'), o = s && s._object; if (o && o.name === 'CV_PP_Kit' && !d.getElementById('busy')) { const out = {};
      for (const pc of o.children) { if (!pc.name.startsWith('CV_')) continue; const g = new THREE.Group(); g.name = pc.name; pc.children.forEach(m => { if (!m.isMesh) return; const mats = (Array.isArray(m.material) ? m.material : [m.material]).map(portMat); const mm = new THREE.Mesh(portMesh(m), mats.length > 1 ? mats : mats[0]); mm.name = m.name; mm.position.copy(m.position); mm.quaternion.copy(m.quaternion); mm.castShadow = mm.receiveShadow = true; g.add(mm); }); out[pc.name] = g; }
      f.remove(); res(out); return; } } catch (e) {} if (performance.now() - t0 > 60000) { f.remove(); res(null); return; } setTimeout(poll, 400); }; poll(); }); return kitP; }
const DX = 42; // depot origin x in the link view: west face at x = 20
const LINE = [['CV_PortOut', 7, 0], ['CV_Straight', 9, 0], ['CV_Straight', 13, 0], ['CV_Straight', 17, 0], ['CV_PortIn', 19, 0], ['CV_PortIn', 19, -8], ['CV_PortIn', 19, 8], ['CV_Straight', 17, -8], ['CV_Straight', 17, 8]];
let linkChecked = false;
function unlink() { link.forEach(o => holder.remove(o)); ids.forEach(i => roots[i].position.set(0, 0, 0)); link = null; }
async function doLink(mode) {
  if (link) unlink(); holder.clear(); const kit = await loadKit(); link = [];
  roots.CollectionPoint.position.set(0, 0, 0); roots.BuyerDepot.position.set(DX, 0, 0); holder.add(roots.CollectionPoint); holder.add(roots.BuyerDepot);
  const placed = []; if (kit) for (const [n, x, z] of LINE) { const o = kit[n].clone(); o.position.set(x, 0, z); holder.add(o); link.push(o); placed.push(o); }
  holder.updateMatrixWorld(true);
  if (!linkChecked && kit) { linkChecked = true;
    let mnOut = 9e9; verts(placed[0], v => mnOut = Math.min(mnOut, v.x)); const lo = wbox(placed[0]).getCenter(new V3());
    ck('Link', `CV_PortOut wall face on the collection point at x = ${mnOut.toFixed(4)} (6), lateral ${Math.abs(lo.z).toFixed(3)}`, Math.abs(mnOut - 6) < E && Math.abs(lo.z) < .02);
    for (const i of [4, 5, 6]) { let mx = -9e9; verts(placed[i], v => mx = Math.max(mx, v.x)); const zc = placed[i].position.z, c = wbox(placed[i]).getCenter(new V3());
      let ex = 9e9, ey = -9; verts(roots.BuyerDepot.getObjectByName('BD_Bays'), v => { if (Math.abs(v.z - zc) < 1.3) { if (v.x < ex - E) { ex = v.x; ey = v.y; } else if (Math.abs(v.x - ex) < E) ey = Math.max(ey, v.y); } });
      ck('Link', `CV_PortIn at bay z = ${zc}: wall face x = ${mx.toFixed(4)}, depot conveyor starts x = ${ex.toFixed(4)} top ${ey.toFixed(3)} (gap ${(ex - mx).toFixed(4)})`, Math.abs(mx - (DX - 22)) < E && Math.abs(ex - mx) < E && Math.abs(c.z - zc) < .02 && Math.abs(ey - 1.32) < .003); }
    renderChecks(); }
  document.querySelectorAll('#pick button').forEach(b => b.setAttribute('aria-pressed', false));
  if (mode === 'bay') { cam.position.set(15.0, 4.6, 5.0); ctl.target.set(20.5, 1.7, 0); sun(new V3(20, 1.5, 0), 8); }
  else { cam.position.set(14, 38, 58); ctl.target.set(30, 2, 0); sun(new V3(30, 0, 0), 40); }
  cam.near = .05; cam.far = 1500; cam.updateProjectionMatrix(); ctl.update(); }
window.__link = doLink;

/* ---------- animation previews ---------- */
const anim = { fill: false, beacon: false, shut: false };
const straw = roots.CollectionPoint.getObjectByName('CP_Straw'), shutters = [1, 2, 3].map(i => roots.BuyerDepot.getObjectByName('BD_Shutter' + i)), emA = L.M.emA, emA0 = emA.emissiveIntensity;
const toggle = (id, k) => { const b = document.getElementById(id); b.onclick = () => { anim[k] = !anim[k]; b.setAttribute('aria-pressed', anim[k]); if (k === 'fill' && !anim[k]) straw.scale.y = 1; if (k === 'shut' && !anim[k]) shutters.forEach(s => s.scale.y = 1); if (k === 'beacon' && !anim[k]) emA.emissiveIntensity = emA0; }; };
toggle('aFill', 'fill'); toggle('aBeacon', 'beacon'); toggle('aShut', 'shut');
(function tick(now) { const t = now / 1000;
  if (anim.fill) straw.scale.y = Math.max(.001, .5 - .5 * Math.cos(t * .8));
  if (anim.beacon) emA.emissiveIntensity = Math.sin(t * 9) > 0 ? 4 : .2;
  if (anim.shut) shutters.forEach((s, i) => s.scale.y = Math.max(.06, .53 + .47 * Math.cos(t * .9 + i * .6)));
  requestAnimationFrame(tick); })(performance.now());

/* ---------- export ---------- */
async function exportOne(id) { const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js'), R = roots[id], pos = R.position.clone(), par = R.parent;
  const keep = [straw.scale.y, ...shutters.map(s => s.scale.y)]; straw.scale.y = 1; shutters.forEach(s => s.scale.y = 1);
  R.position.set(0, 0, 0); if (par) par.remove(R); R.updateMatrixWorld(true);
  try { const buf = await new GLTFExporter().parseAsync(R, { binary: true, embedImages: true, onlyVisible: false });
    const url = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })), a = document.createElement('a'); a.href = url; a.download = id + '.glb'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); return buf.byteLength; }
  finally { R.position.copy(pos); if (par) par.add(R); straw.scale.y = keep[0]; shutters.forEach((s, i) => s.scale.y = keep[i + 1]); } }
const msg = document.getElementById('glbMsg');
document.getElementById('glbBtn').onclick = async () => { if (!cur || link) { msg.textContent = 'pick a building'; return; } msg.textContent = 'exporting…'; try { const n = await exportOne(cur); msg.textContent = `${cur}.glb ${(n / 1048576).toFixed(1)} MB`; } catch (e) { msg.textContent = 'failed: ' + e.message; throw e; } };
document.getElementById('glbAll').onclick = async () => { for (const id of ids) { msg.textContent = 'exporting ' + id + '…'; await exportOne(id); await new Promise(r => setTimeout(r, 600)); } msg.textContent = 'two files downloaded'; };
document.getElementById('minBtn').onclick = e => { const p = document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent = p.classList.contains('min') ? 'show' : 'hide'; };
window.__snap = () => { renderer.setClearColor(0xd6d7d4, 1); renderer.render(scene, cam); let im = document.getElementById('snap'); if (!im) { im = document.createElement('img'); im.id = 'snap'; im.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:50;object-fit:cover'; document.body.appendChild(im); } im.src = renderer.domElement.toDataURL('image/jpeg', .92); document.getElementById('panel').style.display = 'none'; };
window.__unsnap = () => { document.getElementById('snap')?.remove(); document.getElementById('panel').style.display = ''; };
show('BuyerDepot');
</script>
