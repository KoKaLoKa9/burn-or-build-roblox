<body>
<three-d-stage name="WaterSteam_v2" background="#d6d7d4"></three-d-stage>
<div id="busy">Building the water + steam machines…</div>
<aside id="panel">

      <button id="aFan">Spin WP_Fan</button><button id="aShaft">Spin ST_Shaft</button><button id="aFire">Flicker BO_Fire</button><button id="aLvl">Slide WT_Level</button>
    </div></div>
    <div class="sec"><div class="row"><button id="glbBtn" class="primary">Export GLB</button><button id="glbAll">Export all</button><span id="glbMsg" style="align-self:center;color:#5a5c58"></span></div></div>

    <div class="sec"><div class="lab">Checks (all four + chain)</div><table id="checks"></table></div>
    <div class="sec"><div class="lab">Groups · triangles</div><table id="tris"></table></div>
  </div>
</aside>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const renderer = stage._renderer, scene = stage._scene, cam = stage._camera, ctl = stage._controls;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
try { await Promise.all([document.fonts.load('700 40px "IBM Plex Sans Condensed"'), document.fonts.load('600 40px "IBM Plex Mono"'), document.fonts.load('700 40px "Sarabun"', 'อันตราย')]); } catch (e) {}
const L = await import('./ws_machines.js');
const V3 = THREE.Vector3, DEG = Math.PI / 180;
const ids = Object.keys(L.SPEC), roots = {};
for (const id of ids) roots[id] = L.BUILD[id]();
{ const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: new THREE.Color(.42, .43, .44), side: THREE.BackSide })));
  const pn = (w, h, c, p, r) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c, c, c * .97), side: THREE.DoubleSide })); m.position.set(...p); m.rotation.set(...r); env.add(m); };
  pn(30, 30, 4, [0, 14, 0], [Math.PI / 2, 0, 0]); pn(20, 10, 1.6, [28, 6, 10], [0, -Math.PI / 2, 0]); pn(20, 10, 1.0, [-28, 6, -8], [0, Math.PI / 2, 0]);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, .04).texture; scene.environmentIntensity = .6; }
const holder = new THREE.Group(); holder.name = 'Viewer'; stage.setObject(holder);
const reshadow = o => o.traverse(m => { if (m.isMesh) { const mt = Array.isArray(m.material) ? m.material[0] : m.material; m.castShadow = !(mt.transparent || mt.alphaTest > 0 && !mt.map); m.receiveShadow = true; } });
stage._ground.material = new THREE.MeshStandardMaterial({ color: 0xa9aaa6, roughness: .95 }); stage._ground.scale.setScalar(30); stage._ground.position.y = 0;
const key = stage._key; key.intensity = 2.5; key.shadow.mapSize.set(4096, 4096); key.shadow.map?.dispose(); key.shadow.map = null; key.shadow.bias = -.0003; key.shadow.normalBias = .02; scene.add(key.target);
function sun(t, R) { key.target.position.copy(t); key.position.copy(t).add(new V3(22, 40, 26)); const c = key.shadow.camera; c.left = c.bottom = -R; c.right = c.top = R; c.near = 1; c.far = 240; c.updateProjectionMatrix(); }
document.getElementById('busy').remove();

/* ---------- checks ---------- */
const E = 1e-3, tri = m => (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3;
const wbox = o => new THREE.Box3().setFromObject(o, true);
function verts(o, fn) { o.updateMatrixWorld(true); const v = new V3(); o.traverse(m => { if (!m.isMesh) return; const p = m.geometry.attributes.position; for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld); fn(v, m); } }); }
const info = {}, checks = [];
const ck = (id, name, ok, note = '') => checks.push({ id, name, ok, note });
for (const id of ids) {
  const R = roots[id], S = L.SPEC[id], pf = S.pfx; R.position.set(0, 0, 0); R.updateMatrixWorld(true);
  const b = wbox(R), size = b.getSize(new V3()), gr = R.children.map(c => ({ name: c.name, tris: c.isMesh ? tri(c) : c.children.reduce((s, m) => s + tri(m), 0) }));
  const total = gr.reduce((s, g) => s + g.tris, 0); let maxMesh = 0; R.traverse(m => { if (m.isMesh) maxMesh = Math.max(maxMesh, tri(m)); });
  info[id] = { b, size, gr, total, maxMesh };
  const [W, H, D] = S.s, hmax = S.hmax || H;
  ck(id, `Inside ${W} × ${hmax === H ? H : H + ' (' + hmax + ' chimney)'} × ${D}: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`, b.min.x >= -W / 2 - E && b.max.x <= W / 2 + E && b.min.z >= -D / 2 - E && b.max.z <= D / 2 + E && b.max.y <= hmax + E);
  if (S.hmax) { let over = 0; verts(R, (v, m) => { if (v.y > H + E && m.parent.name !== pf + 'Chimney') over++; }); ck(id, 'Only the chimney rises above ' + H, !over, over ? over + ' verts' : ''); }
  ck(id, 'Underside on y = 0, origin bottom centre', Math.abs(b.min.y) < E);
  ck(id, `Triangles ${S.tri[0] / 1000}k–${S.tri[1] / 1000}k (${total.toLocaleString()})`, total >= S.tri[0] && total <= S.tri[1]);
  ck(id, `Every mesh < 20k (max ${maxMesh.toLocaleString()})`, maxMesh < 20000);
  const names = R.children.map(c => c.name), missing = S.groups.filter(g => !names.includes(pf + g)), extra = names.filter(n => !S.groups.map(g => pf + g).includes(n));
  let meshNames = true; R.children.forEach(c => { if (c.isMesh) { if (c.name !== pf + 'WireTop') meshNames = false; } else c.children.forEach(m => { if (!m.isMesh || !m.name.startsWith(c.name + '_')) meshNames = false; }); });
  ck(id, 'Groups as specified, meshes <Group>_<Part>', !missing.length && !extra.length && meshNames, missing.concat(extra).join(' '));
  let bad = 0; R.traverse(o => { if (o.isLight || o.isCamera || /Helper/.test(o.type) || o.isLine) bad++; }); ck(id, 'No lights / cameras / helpers', bad === 0);
  if (S.wire) { const w = R.getObjectByName(pf + 'WireTop'), d = w.position.distanceTo(new V3(...S.wire)); ck(id, `${pf}WireTop hidden 0.2 cube near (${S.wire}) — off ${d.toFixed(2)}`, d < .35 && !w.visible && w.isMesh); }
  for (const P of S.ports) { const g = R.getObjectByName(P.g), n = new V3(...P.n), c = new V3(...P.c), face = c.dot(n); let mx = -1e9, cnt = 0, sum = new V3(), rmax = 0;
    verts(g, v => { mx = Math.max(mx, v.dot(n)); }); verts(g, v => { if (Math.abs(v.dot(n) - face) < E) { cnt++; sum.add(v); } });
    const cen = sum.divideScalar(cnt || 1); verts(g, v => { if (Math.abs(v.dot(n) - face) < E) rmax = Math.max(rmax, v.clone().sub(c).length()); });
    let poke = 0; verts(R, (v, m) => { if (m.parent.name === P.g) return; const lat = v.clone().sub(c).sub(n.clone().multiplyScalar(v.clone().sub(c).dot(n))).length(); if (lat < 1.5 + .9 && v.dot(n) > face - .02) poke++; });
    ck(id, `${P.g} (${P.kind}) flange face on ${['x','','z'][Math.abs(n.x) > .5 ? 0 : 2]} = ${face} at (${cen.toArray().map(v => v.toFixed(2)).join(', ')}), Ø ${(rmax * 2).toFixed(2)}`, Math.abs(mx - face) < E && cen.distanceTo(c) < .01 && Math.abs(rmax - .9) < .02, poke ? poke + ' verts near port' : '');
    ck(id, `Nothing else on that face within 1.5 of ${P.g}`, poke === 0); }
  const gb = R.children.filter(c => c.isGroup && c.children.length).map(c => ({ n: c.name, b: wbox(c) })); const floating = [];
  gb.forEach(g => { if (g.b.min.y <= .03) return; const e = g.b.clone().expandByScalar(.03); if (!gb.some(o => o !== g && e.intersectsBox(o.b))) floating.push(g.n); });
  ck(id, 'No floating groups (each touches the floor or another group)', !floating.length, floating.join(' '));
  const hits = []; for (const [g, mn, mx] of S.solids) { const bx = new THREE.Box3(new V3(...mn), new V3(...mx)).expandByScalar(-.06); let n = 0, who = new Set();
    verts(R, (v, m) => { const pg = m.parent.name; if (pg === g || /_(Glass|Emissive|Details|Fire|Level|Fan|Shaft)$/.test(pg)) return; if (bx.containsPoint(v)) { n++; who.add(pg); } }); if (n) hits.push(g + '←' + [...who].join('/') + ' ' + n); }
  ck(id, 'No clipping into solid housings', !hits.length, hits.join('; '));
}
{ let top = -1, sx = 0, sz = 0, n = 0; const C = roots.Boiler.getObjectByName('BO_Chimney'); verts(C, v => top = Math.max(top, v.y)); verts(C, v => { if (v.y > top - .002) { sx += v.x; sz += v.z; n++; } });
  ck('Boiler', `Chimney top (${(sx / n).toFixed(2)}, ${top.toFixed(3)}, ${(sz / n).toFixed(2)}) = (−3, 13, 3)`, Math.abs(top - 13) < .005 && Math.abs(sx / n + 3) < .02 && Math.abs(sz / n - 3) < .02);
  let clash = 0, feedMin = 9; verts(roots.Boiler, (v, m) => { const g = m.parent.name; if (g === 'BO_Feeder') feedMin = Math.min(feedMin, v.x); if (g === 'BO_Feeder' || v.y <= .31) return; if (v.x < -6.3 && Math.abs(v.z) < 1.25 && v.y < 3.0) clash++; });
  ck('Boiler', 'Straw IN 2.5 × 3 opening on −X clear; feed chute starts at x = −7', clash === 0 && Math.abs(feedMin + 7) < .005, clash ? clash + ' verts' : ''); }
{ const F = roots.WaterPump.getObjectByName('WP_Fan'), c = wbox(F).getCenter(new V3()), o = F.getWorldPosition(new V3()); ck('WaterPump', `WP_Fan origin on its Y axis (${o.toArray().map(v => v.toFixed(2)).join(', ')})`, Math.abs(c.x - o.x) < .02 && Math.abs(c.z - o.z) < .02); }
{ const S = roots.SteamTurbine.getObjectByName('ST_Shaft'), c = wbox(S).getCenter(new V3()), o = S.getWorldPosition(new V3()); ck('SteamTurbine', `ST_Shaft origin on its X axis (${o.toArray().map(v => v.toFixed(2)).join(', ')})`, Math.abs(c.y - o.y) < .02 && Math.abs(c.z - o.z) < .02); }
{ const Lg = roots.WaterTank.getObjectByName('WT_Level'), b = wbox(Lg), o = Lg.getWorldPosition(new V3()); ck('WaterTank', `WT_Level origin at gauge bottom (${o.toArray().map(v => v.toFixed(2)).join(', ')}), full ${(b.max.y - o.y).toFixed(2)} at scale 1`, Math.abs(b.min.y - o.y) < E && b.max.y > o.y + 2); }
const texSet = new Set(); ids.forEach(id => roots[id].traverse(o => { if (!o.isMesh) return; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => ['map', 'normalMap', 'emissiveMap'].forEach(k => m[k] && texSet.add(m[k].source.uuid))); }));
ck('All', `Shared texture images across pack: ${texSet.size}`, true);
function renderChecks() { document.getElementById('checks').innerHTML = checks.map(c => `<tr><td><b>${c.id}</b> ${c.name}${c.note ? ` <span class="bad">${c.note}</span>` : ''}</td><td class="r ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'}</td></tr>`).join('');
  window.__ws = { okAll: checks.every(c => c.ok), fails: checks.filter(c => !c.ok).map(c => c.id + ': ' + c.name + ' ' + c.note), info: Object.fromEntries(ids.map(id => [id, { size: info[id].size.toArray().map(v => +v.toFixed(2)), min: info[id].b.min.toArray().map(v => +v.toFixed(2)), max: info[id].b.max.toArray().map(v => +v.toFixed(2)), total: info[id].total, groups: info[id].gr.map(g => [g.name, g.tris]) }])) }; }
renderChecks();

/* ---------- picker / readout ---------- */
let cur = null, chain = null;
const f2 = v => v.toFixed(2);
function show(id) {
  if (chain) unchain(); holder.clear(); cur = id; roots[id].position.set(0, 0, 0); holder.add(roots[id]); reshadow(roots[id]);
  document.querySelectorAll('#pick button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
  const I = info[id], S = L.SPEC[id];
  document.getElementById('frame').innerHTML = `<b>${id}</b> · prefix ${S.pfx}<br>size ${f2(I.size.x)} × ${f2(I.size.y)} × ${f2(I.size.z)} (limit ${S.s.join(' × ')}${S.hmax ? ', chimney ≤ ' + S.hmax : ''})<br>min (${I.b.min.toArray().map(f2).join(', ')})<br>max (${I.b.max.toArray().map(f2).join(', ')})<br>origin bottom centre · +X east · −Z north<br>${S.ports.map(p => `${p.g} (${p.c.join(', ')}) ${p.kind}`).join('<br>')}${S.straw ? '<br>straw IN opening x = ' + S.straw : ''}${S.wire ? `<br>${S.pfx}WireTop (${S.wire.join(', ')})` : ''}`;
  document.getElementById('tris').innerHTML = I.gr.map(g => `<tr><td>${g.name}</td><td class="r">${g.tris.toLocaleString()}</td></tr>`).join('') + `<tr><td style="font-weight:600;padding-top:4px">Total</td><td class="r" style="font-weight:600;padding-top:4px">${I.total.toLocaleString()}</td></tr>`;
  view('Front ¾');
}
const pick = document.getElementById('pick'); ids.forEach(id => { const b = document.createElement('button'); b.textContent = id; b.dataset.id = id; b.onclick = () => show(id); pick.appendChild(b); });
const CLOSE = { WaterPump: [[2.6, 5.6, 3.0], [.3, 4.6, 0], 'motor'], WaterTank: [[4.2, 8.6, 8.4], [.6, 7.4, 2.6], 'gauge'], Boiler: [[-2.9, 3.0, 6.3], [-2.5, 2.1, 2.4], 'fire door'], SteamTurbine: [[3.8, 3.8, 3.4], [2.55, 2.5, 0], 'coupling'] };
function view(k) {
  if (k === 'Chain') return doChain(); if (k === 'Nozzle') return doChain('nozzle');
  if (chain) show(cur);
  const I = info[cur], c = I.b.getCenter(new V3()), s = Math.max(I.size.x, I.size.y, I.size.z); let p, t, R;
  if (k === 'Front ¾') { t = c.clone(); p = c.clone().add(new V3(s * 1.0, s * .6, s * 1.45)); R = s; }
  else if (k === 'Back ¾') { t = c.clone(); p = c.clone().add(new V3(-s * 1.05, s * .62, -s * 1.4)); R = s; }
  else { const C = CLOSE[cur]; p = new V3(...C[0]); t = new V3(...C[1]); R = s * .7; }
  cam.position.copy(p); ctl.target.copy(t); cam.near = .05; cam.far = 1000; cam.updateProjectionMatrix(); ctl.update(); sun(t, R);
}
const vw = document.getElementById('views'); for (const k of ['Front ¾', 'Back ¾', 'Close-up', 'Chain', 'Nozzle']) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => view(k); vw.appendChild(b); }
window.__show = show; window.__view = view;

/* ---------- chain: PP_ pieces from the conveyor kit ---------- */
function portMesh(o) { const C = { Float32Array, Uint16Array, Uint32Array, Uint8Array, Int16Array, Int32Array, Int8Array };
  const geo = new THREE.BufferGeometry(); for (const k in o.geometry.attributes) { const a = o.geometry.attributes[k]; geo.setAttribute(k, new THREE.BufferAttribute(new C[a.array.constructor.name](a.array), a.itemSize, a.normalized)); }
  if (o.geometry.index) { const ix = o.geometry.index.array; geo.setIndex(new THREE.BufferAttribute(new C[ix.constructor.name](ix), 1)); } o.geometry.groups.forEach(g => geo.addGroup(g.start, g.count, g.materialIndex)); return geo; }
const texCache = new Map();
function portTex(t, srgb) { if (!t || !t.image) return null; if (texCache.has(t.uuid)) return texCache.get(t.uuid); const img = t.image, c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0);
  const n = new THREE.CanvasTexture(c); n.wrapS = t.wrapS; n.wrapT = t.wrapT; n.repeat.set(t.repeat.x, t.repeat.y); n.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; n.anisotropy = 8; texCache.set(t.uuid, n); return n; }
const portMat = m => new THREE.MeshStandardMaterial({ color: m.color ? m.color.getHex() : 0xffffff, roughness: m.roughness ?? .6, metalness: m.metalness ?? 0, map: portTex(m.map, true), normalMap: portTex(m.normalMap, false), transparent: m.transparent, opacity: m.opacity, alphaTest: m.alphaTest, side: m.side, depthWrite: m.depthWrite });
let kitP = null;
function loadKit() { if (kitP) return kitP; kitP = new Promise(res => { const f = document.createElement('iframe'); f.src = 'Conveyor_v2.html'; f.style.cssText = 'position:fixed;left:-2000px;top:0;width:640px;height:480px;opacity:0;pointer-events:none'; document.body.appendChild(f);
  const t0 = performance.now(), poll = () => { try { const d = f.contentDocument, s = d.querySelector('three-d-stage'), o = s && s._object; if (o && o.name === 'CV_PP_Kit' && !d.getElementById('busy')) { const out = {};
      for (const pc of o.children) { if (!pc.name.startsWith('PP_')) continue; const g = new THREE.Group(); g.name = pc.name; pc.children.forEach(m => { if (!m.isMesh) return; const mats = (Array.isArray(m.material) ? m.material : [m.material]).map(portMat); const mm = new THREE.Mesh(portMesh(m), mats.length > 1 ? mats : mats[0]); mm.name = m.name; mm.position.copy(m.position); mm.quaternion.copy(m.quaternion); mm.scale.copy(m.scale); mm.castShadow = mm.receiveShadow = true; g.add(mm); }); out[pc.name] = g; }
      f.remove(); res(out); return; } } catch (e) {} if (performance.now() - t0 > 60000) { f.remove(); res(null); return; } setTimeout(poll, 400); }; poll(); }); return kitP; }
const tint = { water: new THREE.MeshStandardMaterial({ color: 0x3f7fcf, roughness: .45, metalness: .2 }), steam: new THREE.MeshStandardMaterial({ color: 0xb8281c, roughness: .45, metalness: .2 }) };
const MPOS = { WaterPump: [0, 0], WaterTank: [14, 0], Boiler: [25, 13], SteamTurbine: [43, 13] };
const LINE = [['PP_Port', 5, 0, 180, 'water'], ['PP_Straight', 7, 0, 0, 'water'], ['PP_FlowArrow', 7, 0, 0], ['PP_Port', 9, 0, 0, 'water'],
  ['PP_Port', 19, 0, 180, 'water'], ['PP_Straight', 21, 0, 0, 'water'], ['PP_Elbow', 25, 0, 180, 'water'], ['PP_Straight', 25, 4, 90, 'water'], ['PP_FlowArrow', 25, 4, -90], ['PP_Port', 25, 6, -90, 'water'],
  ['PP_Port', 33, 13, 180, 'steam'], ['PP_Bridge2', 34, 13, 0, 'steam'], ['PP_FlowArrow', 34, 13, 0], ['PP_Port', 35, 13, 0, 'steam']];
// each PP_Port wall face against: [machine, port group]
const MATES = [[0, 'WaterPump', 'WP_PortOut'], [3, 'WaterTank', 'WT_PortIn'], [4, 'WaterTank', 'WT_PortOut'], [9, 'Boiler', 'BO_PortWater'], [10, 'Boiler', 'BO_PortOut'], [13, 'SteamTurbine', 'ST_PortIn']];
let chainChecked = false;
function unchain() { chain.forEach(o => holder.remove(o)); ids.forEach(i => roots[i].position.set(0, 0, 0)); chain = null; }
async function doChain(mode) {
  if (chain) unchain(); holder.clear(); const kit = await loadKit(); chain = [];
  for (const id of ids) { roots[id].position.set(MPOS[id][0], 0, MPOS[id][1]); holder.add(roots[id]); reshadow(roots[id]); }
  const placed = [];
  if (kit) for (const [n, x, z, deg, t] of LINE) { const o = kit[n].clone(); o.position.set(x, 0, z); o.rotation.y = deg * DEG; if (t) o.traverse(m => { if (m.isMesh && m.name.endsWith('_Tint')) m.material = tint[t]; }); holder.add(o); chain.push(o); placed.push(o); }
  holder.updateMatrixWorld(true);
  if (!chainChecked && kit) { chainChecked = true; let worst = 0, lat = 0;
    for (const [i, id, pg] of MATES) { const P = L.SPEC[id].ports.find(p => p.g === pg), n = new V3(...P.n), c = new V3(...P.c).add(new V3(MPOS[id][0], 0, MPOS[id][1])), face = c.dot(n);
      let mn = 1e9; verts(placed[i], v => mn = Math.min(mn, v.dot(n))); const bb = wbox(placed[i]).getCenter(new V3()); worst = Math.max(worst, Math.abs(mn - face));
      const off = bb.clone().sub(c); off.sub(n.clone().multiplyScalar(off.dot(n))); off.y = 0; lat = Math.max(lat, off.length()); }
    ck('Chain', `6 PP_Port pieces flush on nozzle faces: max gap ${worst.toFixed(4)}, max lateral offset ${lat.toFixed(3)}`, worst < E && lat < .02); renderChecks(); }
  document.querySelectorAll('#pick button').forEach(b => b.setAttribute('aria-pressed', false));
  if (mode === 'nozzle') { cam.position.set(6.4, 3.4, 3.6); ctl.target.set(4.4, 1.5, 0); sun(new V3(4.5, 1.5, 0), 5); }
  else { cam.position.set(24, 30, 50); ctl.target.set(22, 2, 5); sun(new V3(22, 0, 6), 34); }
  cam.near = .05; cam.far = 1000; cam.updateProjectionMatrix(); ctl.update();
}
window.__chain = doChain;

/* ---------- animation previews ---------- */
const anim = { fan: false, shaft: false, fire: false, lvl: false };
const fan = roots.WaterPump.getObjectByName('WP_Fan'), shaft = roots.SteamTurbine.getObjectByName('ST_Shaft'), lvl = roots.WaterTank.getObjectByName('WT_Level');
const toggle = (id, k) => { const b = document.getElementById(id); b.onclick = () => { anim[k] = !anim[k]; b.setAttribute('aria-pressed', anim[k]); if (k === 'lvl' && !anim[k]) lvl.scale.y = 1; if (k === 'fire' && !anim[k]) { L.M.fire.emissiveIntensity = 1.8; L.M.coal.emissiveIntensity = 1.5; } }; };
toggle('aFan', 'fan'); toggle('aShaft', 'shaft'); toggle('aFire', 'fire'); toggle('aLvl', 'lvl');
let last = performance.now();
(function tick(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (anim.fan) fan.rotation.y += dt * 18; if (anim.shaft) shaft.rotation.x += dt * 12;
  if (anim.fire) { const n = .5 + .5 * Math.sin(t * 23) * Math.sin(t * 7.3 + 1) + .3 * Math.sin(t * 41); L.M.fire.emissiveIntensity = 1.1 + n * 1.2; L.M.coal.emissiveIntensity = 1.0 + n * .8; }
  if (anim.lvl) lvl.scale.y = Math.max(.001, .5 - .5 * Math.cos(t * .9));
  requestAnimationFrame(tick); })(last);

/* ---------- export ---------- */
async function exportOne(id) { const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js'), R = roots[id], pos = R.position.clone(), par = R.parent;
  const keep = [fan.rotation.y, shaft.rotation.x, lvl.scale.y]; fan.rotation.y = 0; shaft.rotation.x = 0; lvl.scale.y = 1;
  R.position.set(0, 0, 0); if (par) par.remove(R); R.updateMatrixWorld(true);
  try { const buf = await new GLTFExporter().parseAsync(R, { binary: true, embedImages: true, onlyVisible: false });
    const url = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })), a = document.createElement('a'); a.href = url; a.download = id + '.glb'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); return buf.byteLength; }
  finally { R.position.copy(pos); if (par) par.add(R); [fan.rotation.y, shaft.rotation.x, lvl.scale.y] = keep; } }
const msg = document.getElementById('glbMsg');
document.getElementById('glbBtn').onclick = async () => { if (!cur || chain) { msg.textContent = 'pick a machine'; return; } msg.textContent = 'exporting…'; try { const n = await exportOne(cur); msg.textContent = `${cur}.glb ${(n / 1048576).toFixed(1)} MB`; } catch (e) { msg.textContent = 'failed: ' + e.message; throw e; } };
document.getElementById('glbAll').onclick = async () => { for (const id of ids) { msg.textContent = 'exporting ' + id + '…'; await exportOne(id); await new Promise(r => setTimeout(r, 600)); } msg.textContent = 'four files downloaded'; };
document.getElementById('minBtn').onclick = e => { const p = document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent = p.classList.contains('min') ? 'show' : 'hide'; };
window.__snap = () => { renderer.setClearColor(0xd6d7d4, 1); renderer.render(scene, cam); let im = document.getElementById('snap'); if (!im) { im = document.createElement('img'); im.id = 'snap'; im.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:50;object-fit:cover'; document.body.appendChild(im); } im.src = renderer.domElement.toDataURL('image/jpeg', .92); document.getElementById('panel').style.display = 'none'; };
window.__unsnap = () => { document.getElementById('snap')?.remove(); document.getElementById('panel').style.display = ''; };
show('Boiler');
</script>
