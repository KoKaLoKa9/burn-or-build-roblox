<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const renderer = stage._renderer, scene = stage._scene;

try { await Promise.all([document.fonts.load('700 40px "IBM Plex Sans Condensed"'), document.fonts.load('600 40px "IBM Plex Mono"')]); } catch (e) {}

const V3 = THREE.Vector3, V2 = THREE.Vector2, TAU = Math.PI * 2, DEG = Math.PI / 180, YUP = new V3(0, 1, 0);
let seed = 20261101;

const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ================= textures (same procedural set as the dryer) ================= */
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  const o = cv(w, h), ctx = o.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) {
    const yu = ((y - 1 + h) % h) * w, yd = ((y + 1) % h) * w, yr = y * w;
    for (let x = 0; x < w; x++) {

      const l = Math.hypot(dx, dy, 1), i = (yr + x) * 4;

}
function blotch(x, W, H, n, col, r0, r1, a) {

}

  for (let i = 0; i < n; i++) {
    const px = rnd() * W, py = rnd() * H, s = rr(smin, smax);
    chipPath(c, px, py, s * 1.25); c.fillStyle = 'rgba(40,44,43,.55)'; c.fill();
    chipPath(c, px, py, s); c.fillStyle = rnd() < .3 ? '#6e4a2e' : '#666a68'; c.fill();
    chipPath(h, px, py, s); h.fillStyle = '#5a5a5a'; h.fill();

}
function paintBase(W, H, nChip) {
  const c = cv(W, H), x = c.getContext('2d'), hc = cv(W, H), h = hc.getContext('2d');
  x.fillStyle = '#226f6b'; x.fillRect(0, 0, W, H);

function makeTextures() {
  const T = {};

    const S = 2048, p = paintBase(S, S, 420), x = p.x, h = p.h;

    weld(0, 4, S, 4); weld(4, 0, 4, S);
    blotch(x, S, S, 26, [190, 172, 128], 60, 220, .3);
    for (let i = 0; i < 2600; i++) { x.globalAlpha = rr(.2, .6); x.fillStyle = rnd() < .5 ? '#cdb27a' : '#d8cfb4'; x.save(); x.translate(rnd() * S, rnd() * S); x.rotate(rnd() * TAU); x.fillRect(0, 0, rr(4, 18), 1.5); x.restore(); }
    x.globalAlpha = 1;
    for (let i = 0; i < 30; i++) { const sx = rnd() * S, sy = rnd() * S, L = rr(60, 220), sg = x.createLinearGradient(0, sy, 0, sy + L); sg.addColorStop(0, 'rgba(120,62,28,.5)'); sg.addColorStop(1, 'rgba(120,62,28,0)'); x.fillStyle = sg; x.fillRect(sx, sy, rr(3, 8), L); }
    T.housing = texFrom(p.c); T.housingN = normalFrom(p.hc, 2.5); }
  { const S = 512, c = cv(S, S), x = c.getContext('2d'), hc = cv(S, S), h = hc.getContext('2d');
    h.fillStyle = '#000'; h.fillRect(0, 0, S, S);
    for (let i = 0; i < 5; i++) { const px = i * S / 5; x.fillStyle = '#a9adab'; x.fillRect(px, 0, 18, S); h.fillStyle = '#fff'; h.fillRect(px, 0, 18, S); h.fillStyle = '#bbb'; h.fillRect(px + 3, 0, 12, S); }
    for (let j = 0; j < 2; j++) { const py = j * S / 2 + 60; x.fillStyle = '#9da19f'; x.fillRect(0, py, S, 12); h.fillStyle = '#e8e8e8'; h.fillRect(0, py, S, 12); }
    x.globalCompositeOperation = 'source-atop'; specks(x, S, S, 900, ['#7f8381', '#c4c7c5', '#8a7a5a'], 1, 4, .2, .6); x.globalCompositeOperation = 'source-over';
    T.grating = texFrom(c); T.gratingN = normalFrom(hc, 5); }
  { const S = 256, c = cv(S, S), x = c.getContext('2d'); x.fillStyle = '#e3ae12'; x.fillRect(0, 0, S, S); x.fillStyle = '#1b1b19';
    for (let i = -3; i < 4; i++) { x.beginPath(); x.moveTo(i * 128, S); x.lineTo(i * 128 + 64, S); x.lineTo(i * 128 + 64 + S, 0); x.lineTo(i * 128 + S, 0); x.closePath(); x.fill(); }
    specks(x, S, S, 700, ['#a7a296', '#6d685f'], .6, 2.6, .3, .8); T.hazard = texFrom(c); }
  { const S = 256, c = cv(S, S), x = c.getContext('2d'); x.fillStyle = '#d9a914'; x.fillRect(0, 0, S, S); specks(x, S, S, 400, ['#b38a10', '#e9c24a'], 1, 3, .3, .6);
    x.globalCompositeOperation = 'destination-out';

    x.globalCompositeOperation = 'source-over'; T.perf = texFrom(c); }
  { // expanded wire mesh for the belt-guard front: mostly open so the belts read
    const S = 256, c = cv(S, S), x = c.getContext('2d'); x.fillStyle = '#d9a914';
    for (let i = 0; i < 4; i++) { x.fillRect(i * 64, 0, 9, S); x.fillRect(0, i * 64, S, 9); }
    T.mesh = texFrom(c); }
  { // rubber belt with cover wear, tile 1 stud
    const S = 512, c = cv(S, S), x = c.getContext('2d'), hc = cv(S, S), h = hc.getContext('2d'); x.fillStyle = '#262624'; x.fillRect(0, 0, S, S); h.fillStyle = '#808080'; h.fillRect(0, 0, S, S);
    for (let i = 0; i < 120; i++) { const y = rnd() * S; x.fillStyle = `rgba(90,88,80,${rr(.05, .18)})`; x.fillRect(0, y, S, rr(1, 4)); h.fillStyle = `rgba(60,60,60,.5)`; h.fillRect(0, y, S, 1); }
    blotch(x, S, S, 30, [150, 128, 80], 20, 80, .25); specks(x, S, S, 1500, ['#b89a58', '#5a5852'], .6, 1.8, .2, .6);
    T.belt = texFrom(c); T.beltN = normalFrom(hc, 1.2); }
  { // compressed straw (bale faces), tile 0.5 stud
    const S = 512, c = cv(S, S), x = c.getContext('2d'), hc = cv(S, S), h = hc.getContext('2d');
    x.fillStyle = '#a9823c'; x.fillRect(0, 0, S, S); h.fillStyle = '#303030'; h.fillRect(0, 0, S, S); x.lineCap = h.lineCap = 'round';
    for (let i = 0; i < 6000; i++) { const px = rnd() * S, py = rnd() * S, L = rr(20, 110), a = rr(-.22, .22), dx = Math.cos(a) * L, dy = Math.sin(a) * L, w = rr(1.5, 4);
      const col = `hsl(${rr(36, 47)},${rr(48, 72)}%,${rr(40, 74)}%)`, hv = (rr(120, 255)) | 0;
      for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { if (px + ox + Math.abs(dx) < 0 || px + ox - Math.abs(dx) > S || py + oy + 20 < 0 || py + oy - 20 > S) continue;

/* ---- SH_Straw (bale on the belt, chopped pile at OUT, chaff) ---- */

  for (const x of [-.32, .32]) { add(bs, boxG(.03, .012, BW + .02), M.twine, [x, BH / 2 + .006, 0]); add(bs, boxG(.03, .012, BW + .02), M.twine, [x, -BH / 2 - .006, 0]); for (const zs of [-1, 1]) add(bs, boxG(.03, BH + .02, .012), M.twine, [x, 0, zs * (BW / 2 + .006)]); }

{

/* ================= merge each SH_ group into one mesh (group stays the node) ================= */
function mergeGroup(grpObj) {
  grpObj.updateMatrixWorld(true); const inv = grpObj.matrixWorld.clone().invert(), byMat = new Map();
  grpObj.traverse(o => { if (!o.isMesh) return; let geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    if (!geo.attributes.normal) geo.computeVertexNormals(); if (!geo.attributes.uv) geo.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(geo.attributes.position.count * 2), 2));
    geo.applyMatrix4(inv.clone().multiply(o.matrixWorld)); const sc = o.material.userData.uvScale || 1;
    if (sc !== 1) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sc, uv.getY(i) * sc); }
    if (!byMat.has(o.material)) byMat.set(o.material, []); byMat.get(o.material).push(geo); });
  let total = 0; for (const l of byMat.values()) for (const gg of l) total += gg.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2), out = new THREE.BufferGeometry(), mats = [];
  let off = 0, mi = 0;
  for (const [m, l] of byMat) { const start = off; for (const gg of l) { const n = gg.attributes.position.count; pos.set(gg.attributes.position.array, off * 3); nor.set(gg.attributes.normal.array, off * 3); uv.set(gg.attributes.uv.array.subarray(0, n * 2), off * 2); off += n; } out.addGroup(start, off - start, mi++); mats.push(m); }
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.computeBoundingBox(); out.computeBoundingSphere();
  const mesh = new THREE.Mesh(out, mats.length === 1 ? mats[0] : mats); mesh.name = grpObj.name + '_Mesh';
  for (const c of [...grpObj.children]) grpObj.remove(c); grpObj.add(mesh); return mesh;
}
const ORDER = ['SH_Foundation', 'SH_Infeed', 'SH_Housing', 'SH_Drive', 'SH_Flywheel', 'SH_Fan', 'SH_Cyclone', 'SH_Outfeed', 'SH_Platform', 'SH_Controls', 'SH_Details', 'SH_Straw', 'SH_Emissive', 'SH_Glass'];

const fly = parts.SH_Flywheel;

/* ================= viewer environment (outside the machine root) ================= */

  const panel = (w, h, c, p, r) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c, c, c * .98), side: THREE.DoubleSide })); m.position.set(...p); m.rotation.set(...r); env.add(m); };

/* ================= report + self-checks ================= */
const box = new THREE.Box3().setFromObject(root, true), sz = box.getSize(new V3()), f = n => n.toFixed(3);
document.getElementById('bbox').innerHTML = `size ${f(sz.x)} × ${f(sz.y)} × ${f(sz.z)}<br>min (${f(box.min.x)}, ${f(box.min.y)}, ${f(box.min.z)})<br>max (${f(box.max.x)}, ${f(box.max.y)}, ${f(box.max.z)})`;
let tot = 0; const tris = {}; const rows = ORDER.map(n => { const t = meshes[n].geometry.attributes.position.count / 3; tris[n] = t; tot += t; return `<tr><td>${n}</td><td class="${t >= 20000 ? 'bad' : ''}">${t.toLocaleString()}</td></tr>`; });
document.getElementById('tris').innerHTML = rows.join('') + `<tr><td style="padding-top:4px;font-weight:600">Total (${ORDER.length} groups)</td><td style="padding-top:4px;font-weight:600">${tot.toLocaleString()}</td></tr>`;
const near = (a, b, e = 1e-3) => Math.abs(a - b) < e;
const fb = meshes.SH_Flywheel.geometry.boundingBox, fc = fb.getCenter(new V3());
let extras = 0; root.traverse(o => { if (o.isLight || o.isCamera || o.type.endsWith('Helper')) extras++; });
const badName = []; root.traverse(o => { if (o !== root && !o.name.startsWith('SH_')) badName.push(o.type); });
const checks = [
  ['Bbox 16 × 10 × 14', near(box.min.x, -8) && near(box.max.x, 8) && near(box.min.y, 0) && near(box.max.y, 10) && near(box.min.z, -7) && near(box.max.z, 7)],
  ['Every group < 20k tris', Object.values(tris).every(t => t < 20000)],
  [`Total in 60–90k (${Math.round(tot / 1000)}k)`, tot >= 60000 && tot <= 90000],
  ['Flywheel bbox centre on axis', fc.length() < 1e-3],
  ['No lights/cameras/helpers in root', extras === 0],

];
document.getElementById('checks').innerHTML = checks.map(([k, ok]) => `<tr><td>${k}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</td></tr>`).join('');
window.__shredder = { box: [box.min.toArray(), box.max.toArray()], tot, tris, checks: Object.fromEntries(checks), flyCentre: fc.toArray() };

const dustPt = new THREE.Mesh(new THREE.SphereGeometry(.12, 16, 8), new THREE.MeshBasicMaterial({ color: 0x3fa9f5 })); dustPt.position.set(-4.4, 8.9, -4.6); helpers.add(dustPt);

const tick = now => { const dt = Math.min(.05, (now - last) / 1000); last = now; if (spin) fly.rotation.z -= dt * TAU * .5; requestAnimationFrame(tick); }; requestAnimationFrame(tick);
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }; };
