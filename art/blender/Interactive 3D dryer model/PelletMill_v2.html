<script type="importmap">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=Sarabun:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#d6d7d4;color:#1c1d1b;font-family:"IBM Plex Mono",ui-monospace,monospace}
  a{color:#1f6f6c}a:hover{color:#0f4846}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{height:100vh}
  #panel{position:fixed;top:12px;left:12px;width:330px;max-width:calc(100vw - 24px);max-height:calc(100vh - 80px);overflow:auto;background:rgba(250,250,247,.94);border:1px solid rgba(0,0,0,.12);border-radius:6px;font-size:11px;line-height:1.45;box-sizing:border-box}
  #panel header{padding:10px 12px 8px;border-bottom:1px solid rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  #panel h1{margin:0;font:700 15px/1.1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.02em}
  #panel .sec{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.08)}
  #panel .lab{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:#5a5c58;margin-bottom:4px}
  #panel table{width:100%;border-collapse:collapse}
  #panel td{padding:1px 0;vertical-align:top}#panel td.r{text-align:right;white-space:nowrap;padding-left:6px}
  #panel .bad{color:#b3261e;font-weight:600}#panel .ok{color:#1f6f6c;font-weight:600}
  #panel .row{display:flex;flex-wrap:wrap;gap:4px}
  #panel button{font:500 11px "IBM Plex Mono",monospace;padding:5px 7px;border:1px solid rgba(0,0,0,.18);background:#fff;border-radius:4px;cursor:pointer;color:#1c1d1b}
  #panel button:hover{background:#eef3f2}
  #panel button[aria-pressed="true"],#panel button.primary{background:#1f6f6c;color:#fff;border-color:#1f6f6c}
  #panel .tog{background:none;border:none;padding:0;font-size:11px;color:#5a5c58}
  #panel.min .body{display:none}
  #busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 13px "IBM Plex Mono",monospace;color:#3b3d3a;pointer-events:none}

<body>
<three-d-stage name="PelletMill_v2" background="#d6d7d4"></three-d-stage>
<div id="busy">Building the pellet mill…</div>
<aside id="panel">
  <header><h1>PELLET MILL · v2</h1><button class="tog" id="minBtn">hide</button></header>
  <div class="body">
    <div class="sec"><div class="lab">Views</div><div class="row" id="views"></div></div>
    <div class="sec"><div class="lab">Preview</div><div class="row"><button id="aSpin">Spin PM_Die</button><button id="aGlass" aria-pressed="true">Glass</button></div></div>
    <div class="sec"><div class="row"><button id="glbBtn" class="primary">Export GLB</button><span id="glbMsg" style="align-self:center;color:#5a5c58"></span></div></div>
    <div class="sec"><div class="lab">Frame (1 unit = 1 stud)</div><div id="frame"></div></div>
    <div class="sec"><div class="lab">Checks</div><table id="checks"></table></div>
    <div class="sec"><div class="lab">Groups · triangles</div><table id="tris"></table></div>
  </div>
</aside>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const renderer = stage._renderer, scene = stage._scene, cam = stage._camera, ctl = stage._controls;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
try { await Promise.all([document.fonts.load('700 40px "IBM Plex Sans Condensed"'), document.fonts.load('600 40px "IBM Plex Mono"'), document.fonts.load('700 40px "Sarabun"', 'ผิวร้อน')]); } catch (e) {}
const L = await import('./pm_machine.js');
const V3 = THREE.Vector3, DEG = Math.PI / 180, S = L.SPEC;
const R = L.buildPelletMill();
{ const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: new THREE.Color(.42, .43, .44), side: THREE.BackSide })));
  const pn = (w, h, c, p, r) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c, c, c * .97), side: THREE.DoubleSide })); m.position.set(...p); m.rotation.set(...r); env.add(m); };
  pn(30, 30, 4, [0, 14, 0], [Math.PI / 2, 0, 0]); pn(20, 10, 1.6, [28, 6, 10], [0, -Math.PI / 2, 0]); pn(20, 10, 1.0, [-28, 6, -8], [0, Math.PI / 2, 0]);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, .04).texture; scene.environmentIntensity = .6; }
const holder = new THREE.Group(); holder.name = 'Viewer'; stage.setObject(holder); holder.add(R);
stage._ground.material = new THREE.MeshStandardMaterial({ color: 0xa9aaa6, roughness: .95 }); stage._ground.scale.setScalar(30); stage._ground.position.y = 0;
const key = stage._key; key.intensity = 2.5; key.shadow.mapSize.set(4096, 4096); key.shadow.map?.dispose(); key.shadow.map = null; key.shadow.bias = -.0003; key.shadow.normalBias = .02; scene.add(key.target);
function sun(t, r) { key.target.position.copy(t); key.position.copy(t).add(new V3(22, 40, -26)); const c = key.shadow.camera; c.left = c.bottom = -r; c.right = c.top = r; c.near = 1; c.far = 220; c.updateProjectionMatrix(); }
document.getElementById('busy').remove();

/* ---------- checks ---------- */
const E = 2e-3, tri = m => (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3;
const wbox = o => new THREE.Box3().setFromObject(o, true);
function verts(o, fn) { o.updateMatrixWorld(true); const v = new V3(); o.traverse(m => { if (!m.isMesh) return; const p = m.geometry.attributes.position; for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld); fn(v, m); } }); }
R.updateMatrixWorld(true);
const b = wbox(R), size = b.getSize(new V3()), pf = S.pfx;
const gr = R.children.map(c => ({ name: c.name, tris: c.children.reduce((s, m) => s + tri(m), 0), meshes: c.children.length, max: Math.max(0, ...c.children.map(tri)) }));
const total = gr.reduce((s, g) => s + g.tris, 0), maxGroup = Math.max(...gr.map(g => g.tris));
const checks = [], ck = (name, ok, note = '') => checks.push({ name, ok, note });
const [W, H, D] = S.size;
ck(`Bounding box ${size.x.toFixed(3)} × ${size.y.toFixed(3)} × ${size.z.toFixed(3)} = ${W} × ${H} × ${D}`, Math.abs(b.min.x + W / 2) < E && Math.abs(b.max.x - W / 2) < E && Math.abs(b.min.z + D / 2) < E && Math.abs(b.max.z - D / 2) < E && Math.abs(b.min.y) < E && Math.abs(b.max.y - H) < E);
ck('Origin bottom centre, slab underside on y = 0', Math.abs(b.min.y) < E && R.position.length() === 0);
ck(`Total ${total.toLocaleString()} triangles (70k–110k)`, total >= S.tri[0] && total <= S.tri[1]);
ck(`Every group < 20k triangles (max ${maxGroup.toLocaleString()})`, maxGroup < 20000);
const names = R.children.map(c => c.name), want = S.groups.map(g => pf + g), missing = want.filter(n => !names.includes(n)), extra = names.filter(n => !want.includes(n));
let meshNames = true, allPM = true; R.traverse(o => { if (o !== R && !o.name.startsWith('PM_')) allPM = false; }); R.children.forEach(c => c.children.forEach(m => { if (!m.isMesh || !m.name.startsWith(c.name + '_')) meshNames = false; }));
ck('17 groups as specified, direct children; meshes <Group>_<Part>', !missing.length && !extra.length && meshNames, missing.concat(extra).join(' '));
ck('Every name starts with PM_ (no DY_ / SH_)', allPM);
let bad = 0; R.traverse(o => { if (o.isLight || o.isCamera || /Helper/.test(o.type) || o.isLine) bad++; }); ck('No lights / cameras / helpers in root', bad === 0);
{ let top = -1, sx = 0, sz = 0, n = 0; const C = R.getObjectByName('PM_Cooler'); verts(C, v => { if (Math.hypot(v.x + 2.4, v.z + 5.2) < .32 && v.y > 12.15 && v.y < 12.25) { top = Math.max(top, v.y); sx += v.x; sz += v.z; n++; } });
  ck(`Vent stack outlet (${(sx / n).toFixed(2)}, ${top.toFixed(3)}, ${(sz / n).toFixed(2)}) = (−2.4, 12.2, −5.2)`, n > 0 && Math.abs(top - 12.2) < .005 && Math.abs(sx / n + 2.4) < .02 && Math.abs(sz / n + 5.2) < .02); }
{ const Dg = R.getObjectByName('PM_Die'), db = wbox(Dg), c = db.getCenter(new V3()), o = Dg.getWorldPosition(new V3()), ax = new V3(0, 0, 1).applyQuaternion(Dg.getWorldQuaternion(new THREE.Quaternion()));
  ck(`PM_Die origin on axis (${o.toArray().map(v => v.toFixed(2)).join(', ')}), axis Z, box centre on axis`, Math.abs(c.x - o.x) < .01 && Math.abs(c.y - o.y) < .01 && Math.abs(ax.z - 1) < 1e-6);
  // die visible behind window: window disc centre ray hits die before chamber back
  const gw = wbox(R.getObjectByName('PM_Glass')); let win = false; verts(R.getObjectByName('PM_Glass'), v => { if (Math.abs(v.z + 3.66) < .01 && Math.hypot(v.x, v.y - 3) < 1.03) win = true; });
  ck('Die window glass in front of ring die (z −3.66 vs die face ' + db.min.z.toFixed(2) + ')', win && db.min.z > -3.66); }
{ let clashIn = 0, clashOut = 0; verts(R, (v, m) => { const g = m.parent.name; if (v.y <= .31 || v.y >= 3.0 || Math.abs(v.z) >= 1.25) return;
    if (v.x < -8.0 && !['PM_Infeed', 'PM_Straw'].includes(g)) clashIn++; if (v.x > 8.0 && !['PM_Outfeed', 'PM_Pellets', 'PM_Details'].includes(g)) clashOut++; });
  let hop = 9; verts(R.getObjectByName('PM_Infeed'), v => hop = Math.min(hop, v.x)); let crate = -9; verts(R.getObjectByName('PM_Outfeed'), v => crate = Math.max(crate, v.x));
  ck(`IN (−X): 2.5 × 3 gap clear, hopper starts at x = ${hop.toFixed(2)}`, !clashIn && Math.abs(hop + 9) < E, clashIn ? clashIn + ' verts' : '');
  ck(`OUT (+X): 2.5 × 3 gap clear, crate reaches x = ${crate.toFixed(2)}`, !clashOut && crate > 8.85 && crate <= 9 + E, clashOut ? clashOut + ' verts' : ''); }
{ const gb = R.children.filter(c => c.children.length).map(c => ({ n: c.name, b: wbox(c) })), floating = [];
  gb.forEach(g => { if (g.b.min.y <= .32) return; const e = g.b.clone().expandByScalar(.03); if (!gb.some(o => o !== g && e.intersectsBox(o.b))) floating.push(g.n); });
  ck('Nothing floats (every group touches slab or another group)', !floating.length, floating.join(' ')); }
{ let below = 0; verts(R, (v, m) => { if (m.parent.name !== 'PM_Foundation' && v.y < .3 - .002) below++; }); ck('Nothing sinks into the slab (all parts y ≥ 0.30)', !below, below ? below + ' verts' : ''); }
{ // clipping: other groups' vertices inside solid housings
  const hits = []; for (const [g, mn, mx] of S.solids) { const bx = new THREE.Box3(new V3(...mn), new V3(...mx)).expandByScalar(-.06); let n = 0, who = new Set();
    verts(R, (v, m) => { const pg = m.parent.name; if (pg === g || ['PM_Glass', 'PM_Emissive', 'PM_Details', 'PM_Die'].includes(pg)) return; if (bx.containsPoint(v)) { n++; who.add(pg); } }); if (n) hits.push(g + '←' + [...who].join('/') + ' ' + n); }
  ck('No clipping into solid housings (press, cooler, cabinet, motor, conditioner)', !hits.length, hits.join('; ')); }
const texSet = new Set(); R.traverse(o => { if (!o.isMesh) return; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => ['map', 'normalMap', 'emissiveMap'].forEach(k => m[k] && texSet.add(m[k].source.uuid))); });
ck(`Texture images (shared kit): ${texSet.size}`, true);
document.getElementById('checks').innerHTML = checks.map(c => `<tr><td>${c.name}${c.note ? ` <span class="bad">${c.note}</span>` : ''}</td><td class="r ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✗'}</td></tr>`).join('');
const f2 = v => v.toFixed(2);
document.getElementById('frame').innerHTML = `<b>PelletMill</b> · prefix PM_<br>size ${f2(size.x)} × ${f2(size.y)} × ${f2(size.z)}<br>min (${b.min.toArray().map(f2).join(', ')})<br>max (${b.max.toArray().map(f2).join(', ')})<br>+X east OUT · −X west IN · ports y 1.5<br>vent stack top (−2.4, 12.2, −5.2)<br>PM_Die axis (0, 3.0, −2.9) along Z`;
document.getElementById('tris').innerHTML = gr.map(g => `<tr><td>${g.name}</td><td class="r">${g.meshes}</td><td class="r ${g.tris < 20000 ? '' : 'bad'}">${g.tris.toLocaleString()}</td></tr>`).join('') + `<tr><td style="font-weight:600;padding-top:4px">Total</td><td></td><td class="r" style="font-weight:600;padding-top:4px">${total.toLocaleString()}</td></tr>`;
window.__pm = { ok: checks.every(c => c.ok), fails: checks.filter(c => !c.ok).map(c => c.name + ' ' + c.note), size: size.toArray().map(f2), total, groups: gr.map(g => [g.name, g.tris]) };

/* ---------- views ---------- */
let side = null;
const VIEWS = { 'Front ¾': [[17, 13, -24], [0, 5, 0], 16], 'Back ¾': [[-18, 13, 24], [0, 5, 0], 16], 'Top': [[0, 34, -.01], [0, 0, 0], 16], 'Die window': [[.9, 3.7, -6.6], [0, 3.0, -3.3], 4], 'Outfeed crate': [[11.6, 4.2, -3.6], [8.0, 1.4, 0], 4], 'Side by side': null };
function view(k) { if (k === 'Side by side') return sideBySide(); if (side) unside();
  const [p, t, r] = VIEWS[k]; cam.position.set(...p); ctl.target.set(...t); cam.near = .05; cam.far = 1000; cam.updateProjectionMatrix(); ctl.update(); sun(new V3(...t), r); }
const vw = document.getElementById('views'); for (const k of Object.keys(VIEWS)) { const bt = document.createElement('button'); bt.textContent = k; bt.onclick = () => view(k); vw.appendChild(bt); }
window.__view = view;

/* ---------- side by side with dryer + shredder (live from their pages) ---------- */
function portMesh(o) { const C = { Float32Array, Uint16Array, Uint32Array, Uint8Array, Int16Array, Int32Array, Int8Array };
  const geo = new THREE.BufferGeometry(); for (const k in o.geometry.attributes) { const a = o.geometry.attributes[k]; geo.setAttribute(k, new THREE.BufferAttribute(new C[a.array.constructor.name](a.array), a.itemSize, a.normalized)); }
  if (o.geometry.index) { const ix = o.geometry.index.array; geo.setIndex(new THREE.BufferAttribute(new C[ix.constructor.name](ix), 1)); } o.geometry.groups.forEach(g => geo.addGroup(g.start, g.count, g.materialIndex)); return geo; }
const texCache = new Map();
function portTex(t, srgb) { if (!t || !t.image) return null; if (texCache.has(t.uuid)) return texCache.get(t.uuid); const img = t.image, c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0);
  const n = new THREE.CanvasTexture(c); n.wrapS = t.wrapS; n.wrapT = t.wrapT; n.repeat.set(t.repeat.x, t.repeat.y); n.offset.set(t.offset.x, t.offset.y); n.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; n.anisotropy = 8; texCache.set(t.uuid, n); return n; }
const portMat = m => new THREE.MeshStandardMaterial({ color: m.color ? m.color.getHex() : 0xffffff, roughness: m.roughness ?? .6, metalness: m.metalness ?? 0, map: portTex(m.map, true), normalMap: portTex(m.normalMap, false), emissive: m.emissive ? m.emissive.getHex() : 0, emissiveIntensity: m.emissiveIntensity ?? 1, emissiveMap: portTex(m.emissiveMap, true), transparent: m.transparent, opacity: m.opacity, alphaTest: m.alphaTest, side: m.side, depthWrite: m.depthWrite, polygonOffset: m.polygonOffset, polygonOffsetFactor: m.polygonOffsetFactor, polygonOffsetUnits: m.polygonOffsetUnits });
const refs = {};
function loadRef(file) { if (refs[file]) return refs[file]; return refs[file] = new Promise(res => { const f = document.createElement('iframe'); f.src = file; f.style.cssText = 'position:fixed;left:-2000px;top:0;width:640px;height:480px;opacity:0;pointer-events:none'; document.body.appendChild(f);
  const t0 = performance.now(), poll = () => { try { const s = f.contentDocument.querySelector('three-d-stage'), o = s && s._object; if (o && o.children.length && !f.contentDocument.getElementById('busy')) { o.updateMatrixWorld(true); const g = new THREE.Group();
      o.traverse(m => { if (!m.isMesh || !m.visible) return; const mats = (Array.isArray(m.material) ? m.material : [m.material]).map(portMat); const mm = new THREE.Mesh(portMesh(m), mats.length > 1 ? mats : mats[0]); mm.matrixAutoUpdate = false; mm.matrix.fromArray(m.matrixWorld.elements); mm.castShadow = mm.receiveShadow = true; g.add(mm); });
      f.remove(); res(g); return; } } catch (e) {} if (performance.now() - t0 > 60000) { f.remove(); res(null); return; } setTimeout(poll, 400); }; poll(); }); }
function unside() { side.forEach(o => holder.remove(o)); R.position.set(0, 0, 0); side = null; }
async function sideBySide() { if (side) unside(); const [dy, sh] = await Promise.all([loadRef('Dryer_v2.html'), loadRef('Shredder_v2.html')]); side = [];
  const items = [dy, sh, R].filter(Boolean).map(o => { const bb = new THREE.Box3().setFromObject(o); return { o, bb, w: bb.max.x - bb.min.x }; }), gap = 3, tot = items.reduce((s, i) => s + i.w, 0) + gap * (items.length - 1); let x = -tot / 2;
  for (const it of items) { const wrap = it.o === R ? R : new THREE.Group(); if (it.o !== R) { wrap.add(it.o); holder.add(wrap); side.push(wrap); } wrap.position.x = x - it.bb.min.x; x += it.w + gap; }
  const vf = cam.fov * DEG / 2, hf = Math.atan(Math.tan(vf) * cam.aspect), dist = (tot / 2 + 3) / Math.tan(hf) * 1.02; cam.position.set(4, dist * .36, -dist); ctl.target.set(0, 4.5, 0); cam.near = .1; cam.far = 1000; cam.updateProjectionMatrix(); ctl.update(); sun(new V3(0, 0, 0), tot / 2 + 6); }
window.__side = sideBySide;

/* ---------- preview + export ---------- */
const die = R.getObjectByName('PM_Die'), glass = R.getObjectByName('PM_Glass'); let spin = false;
document.getElementById('aSpin').onclick = e => { spin = !spin; e.target.setAttribute('aria-pressed', spin); };
document.getElementById('aGlass').onclick = e => { glass.visible = !glass.visible; e.target.setAttribute('aria-pressed', glass.visible); };
let last = performance.now(); (function tick(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; if (spin) die.rotation.z += dt * 2.2; requestAnimationFrame(tick); })(last);
const msg = document.getElementById('glbMsg');
document.getElementById('glbBtn').onclick = async () => { msg.textContent = 'exporting…'; const pos = R.position.clone(), rz = die.rotation.z, par = R.parent;
  try { const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js'); R.position.set(0, 0, 0); die.rotation.z = 0; par.remove(R); R.updateMatrixWorld(true);
    const buf = await new GLTFExporter().parseAsync(R, { binary: true, embedImages: true, onlyVisible: false });
    const url = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })), a = document.createElement('a'); a.href = url; a.download = 'PelletMill_v2.glb'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    msg.textContent = (buf.byteLength / 1048576).toFixed(1) + ' MB'; } catch (e) { msg.textContent = 'failed: ' + e.message; throw e; } finally { par.add(R); R.position.copy(pos); die.rotation.z = rz; } };
document.getElementById('minBtn').onclick = e => { const p = document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent = p.classList.contains('min') ? 'show' : 'hide'; };
window.__snap = () => { renderer.setClearColor(0xd6d7d4, 1); renderer.render(scene, cam); let im = document.getElementById('snap'); if (!im) { im = document.createElement('img'); im.id = 'snap'; im.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:50;object-fit:cover'; document.body.appendChild(im); } im.src = renderer.domElement.toDataURL('image/jpeg', .92); document.getElementById('panel').style.display = 'none'; };
window.__unsnap = () => { document.getElementById('snap')?.remove(); document.getElementById('panel').style.display = ''; };
view('Front ¾');
</script>
</body>
