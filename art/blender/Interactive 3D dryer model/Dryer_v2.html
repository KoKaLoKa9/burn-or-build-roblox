<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const renderer = stage._renderer, scene = stage._scene;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .82;
try { await Promise.all([document.fonts.load('700 40px "IBM Plex Sans Condensed"'), document.fonts.load('600 40px "IBM Plex Mono"')]); } catch (e) {}

const V3 = THREE.Vector3, V2 = THREE.Vector2, TAU = Math.PI * 2, DEG = Math.PI / 180, YUP = new V3(0, 1, 0);
let seed = 20261029;

/* ================= textures (canvas → PBR maps) ================= */
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function texFrom(c, srgb = true, rep = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t; }

  for (let y = 0; y < h; y++) {
    const yu = ((y - 1 + h) % h) * w, yd = ((y + 1) % h) * w, yr = y * w;
    for (let x = 0; x < w; x++) {
      const xl = (x - 1 + w) % w, xr = (x + 1) % w;
      const dx = (s[(yr + xr) * 4] - s[(yr + xl) * 4]) / 255 * k, dy = (s[(yd + x) * 4] - s[(yu + x) * 4]) / 255 * k;
      const l = Math.hypot(dx, dy, 1), i = (yr + x) * 4;

    }

}
function blotch(x, W, H, n, col, r0, r1, a) {
  for (let i = 0; i < n; i++) {
    const px = rnd() * W, py = rnd() * H, r = rr(r0, r1), al = a * rr(.5, 1);
    for (const ox of [-W, 0, W]) for (const oy of [-H, 0, H]) {
      const X = px + ox, Y = py + oy; if (X + r < 0 || X - r > W || Y + r < 0 || Y - r > H) continue;
      const g = x.createRadialGradient(X, Y, 0, X, Y, r); g.addColorStop(0, rgba(col, al)); g.addColorStop(1, rgba(col, 0));
      x.fillStyle = g; x.fillRect(X - r, Y - r, 2 * r, 2 * r);
    }
  }
}
function specks(x, W, H, n, cols, r0, r1, a0, a1) {
  for (let i = 0; i < n; i++) { x.globalAlpha = rr(a0, a1); x.fillStyle = cols[(rnd() * cols.length) | 0]; x.beginPath(); x.arc(rnd() * W, rnd() * H, rr(r0, r1), 0, TAU); x.fill(); }

}
function chipPath(x, cx, cy, s) { x.beginPath(); const n = 7; for (let i = 0; i < n; i++) { const a = i / n * TAU, r = s * rr(.45, 1.1); i ? x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r * rr(.6, 1)) : x.moveTo(cx + r, cy); } x.closePath(); }
function chips(c, h, W, H, n, smin, smax) {
  for (let i = 0; i < n; i++) {
    const px = rnd() * W, py = rnd() * H, s = rr(smin, smax);
    chipPath(c, px, py, s * 1.25); c.fillStyle = 'rgba(40,44,43,.55)'; c.fill();
    chipPath(c, px, py, s); c.fillStyle = rnd() < .3 ? '#6e4a2e' : '#666a68'; c.fill();
    chipPath(h, px, py, s); h.fillStyle = '#5a5a5a'; h.fill();
  }
}
function paintBase(W, H, nChip) {
  const c = cv(W, H), x = c.getContext('2d'), hc = cv(W, H), h = hc.getContext('2d');
  x.fillStyle = '#226f6b'; x.fillRect(0, 0, W, H);
  blotch(x, W, H, 40, [44, 132, 126], W * .03, W * .12, .35); blotch(x, W, H, 40, [18, 76, 74], W * .03, W * .12, .3);
  specks(x, W, H, W * 3, ['#c8bc98', '#a89a74'], .5, 1.6, .08, .3);
  h.fillStyle = '#b0b0b0'; h.fillRect(0, 0, W, H); specks(h, W, H, W * 2, ['#a4a4a4', '#bcbcbc'], 1, 3, .4, .8);

  const T = {};

    specks(x, S, S, 9000, ['#8a857a', '#c0bbaf', '#6c685f', '#9b958a'], .5, 1.8, .25, .7);
    const hc = cv(S, S), h = hc.getContext('2d'); h.fillStyle = '#888'; h.fillRect(0, 0, S, S);

    T.concrete = texFrom(c); T.concreteN = normalFrom(hc, 1.6);
  }
  { const p = paintBase(1024, 1024, 160); T.teal = texFrom(p.c); T.tealN = normalFrom(p.hc, 2); }
  { // drum shell 2048: u around, v along (v=0 feed end)
    const W = 2048, H = 2048, p = paintBase(W, H, 520), x = p.x, h = p.h;
    const weld = (x0, y0, x1, y1) => { x.strokeStyle = 'rgba(20,60,58,.55)'; x.lineWidth = 7; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
      h.strokeStyle = '#e6e6e6'; h.lineWidth = 6; h.beginPath(); h.moveTo(x0, y0); h.lineTo(x1, y1); h.stroke(); h.strokeStyle = '#d0d0d0'; h.lineWidth = 11; h.globalAlpha = .4; h.stroke(); h.globalAlpha = 1; };
    for (let k = 0; k <= 6; k++) weld(0, H * k / 6, W, H * k / 6);
    for (let k = 0; k < 6; k++) for (let j = 0; j < 3; j++) { const u = ((j / 3) + (k % 2) * (1 / 6) + .05) * W; weld(u, H * k / 6, u, H * (k + 1) / 6); }
    const g = x.createLinearGradient(0, H, 0, H * .62);
    g.addColorStop(0, 'rgba(52,34,24,.85)'); g.addColorStop(.12, 'rgba(120,78,40,.6)'); g.addColorStop(.3, 'rgba(150,118,60,.32)'); g.addColorStop(.55, 'rgba(70,82,122,.18)'); g.addColorStop(1, 'rgba(70,82,122,0)');
    x.fillStyle = g; x.fillRect(0, H * .62, W, H * .38);
    specks(x, W, H * .3, 3000, ['#2a1d14', '#4a3524'], 1, 4, .15, .4);
    const dg = x.createLinearGradient(W * .62, 0, W * .88, 0); dg.addColorStop(0, 'rgba(196,184,150,0)'); dg.addColorStop(.5, 'rgba(196,184,150,.42)'); dg.addColorStop(1, 'rgba(196,184,150,0)');
    x.fillStyle = dg; x.fillRect(W * .62, 0, W * .26, H);
    for (let i = 0; i < 2600; i++) { x.globalAlpha = rr(.2, .7); x.fillStyle = rnd() < .5 ? '#cdb27a' : '#d8cfb4'; x.save(); x.translate(rr(W * .66, W * .84), rnd() * H); x.rotate(rnd() * TAU); x.fillRect(0, 0, rr(4, 18), 1.5); x.restore(); }
    x.globalAlpha = 1;
    for (let i = 0; i < 40; i++) { const sx = rnd() * W, sy = H * Math.floor(rnd() * 6) / 6 + 6, L = rr(40, 160); const sg = x.createLinearGradient(0, sy, 0, sy + L); sg.addColorStop(0, 'rgba(120,62,28,.55)'); sg.addColorStop(1, 'rgba(120,62,28,0)'); x.fillStyle = sg; x.fillRect(sx, sy, rr(3, 8), L); }
    T.drum = texFrom(p.c, true, false); T.drumN = normalFrom(p.hc, 3);
  }
  { // refractory brick, 2048 = 2x2 studs
    const S = 2048, rows = 8, per = 3, rh = S / rows, bw = S / per, m = 18;
    const c = cv(S, S), x = c.getContext('2d'), hc = cv(S, S), h = hc.getContext('2d');
    x.fillStyle = '#8b8376'; x.fillRect(0, 0, S, S); h.fillStyle = '#404040'; h.fillRect(0, 0, S, S);
    specks(x, S, S, 8000, ['#7a7266', '#9d9588'], 1, 3, .4, .8);
    for (let r = 0; r < rows; r++) { const off = (r % 2) * bw / 2;
      for (let k = -1; k <= per; k++) { const x0 = k * bw + off + m / 2, y0 = r * rh + m / 2, w = bw - m, hh = rh - m;
        const dark = rnd() < .12; const col = `hsl(${rr(24, 36)},${rr(28, 46)}%,${dark ? rr(36, 44) : rr(54, 68)}%)`;
        for (const ox of [-S, 0, S]) { if (x0 + ox > S || x0 + ox + w < 0) continue;
          x.fillStyle = col; x.fillRect(x0 + ox, y0, w, hh); h.fillStyle = '#cfcfcf'; h.fillRect(x0 + ox, y0, w, hh);
          h.fillStyle = '#e2e2e2'; h.fillRect(x0 + ox + 10, y0 + 10, w - 20, hh - 20);
          for (let e = 0; e < 5; e++) { const ex = x0 + ox + rnd() * w, ey = rnd() < .5 ? y0 + rr(0, 8) : y0 + hh - rr(0, 8); chipPath(x, ex, ey, rr(6, 16)); x.fillStyle = '#7d7468'; x.fill(); chipPath(h, ex, ey, rr(6, 16)); h.fillStyle = '#707070'; h.fill(); }
        } } }

    T.brick = texFrom(c); T.brickN = normalFrom(hc, 2.5);
  }
  { // galvanised grating, 512 = 0.5 stud, alpha holes
    const S = 512, c = cv(S, S), x = c.getContext('2d'), hc = cv(S, S), h = hc.getContext('2d');
    h.fillStyle = '#000'; h.fillRect(0, 0, S, S);
    for (let i = 0; i < 5; i++) { const px = i * S / 5; x.fillStyle = '#a9adab'; x.fillRect(px, 0, 18, S); h.fillStyle = '#fff'; h.fillRect(px, 0, 18, S); h.fillStyle = '#bbb'; h.fillRect(px + 3, 0, 12, S); }
    for (let j = 0; j < 2; j++) { const py = j * S / 2 + 60; x.fillStyle = '#9da19f'; x.fillRect(0, py, S, 12); h.fillStyle = '#e8e8e8'; h.fillRect(0, py, S, 12); }
    x.globalCompositeOperation = 'source-atop'; specks(x, S, S, 900, ['#7f8381', '#c4c7c5', '#8a7a5a'], 1, 4, .2, .6); x.globalCompositeOperation = 'source-over';

  { // hazard stripes, 256 = 0.5 stud

    specks(x, S, S, 700, ['#a7a296', '#6d685f'], .6, 2.6, .3, .8); T.hazard = texFrom(c);

    x.fillStyle = '#c1c4c3'; x.fillRect(0, 0, S, S);

  for (const [x, y, z, h] of [[-5.9, 4.6, 2.607, .9], [-6.4, 7.8, 2.607, .6], [5.9, 6.6, 2.607, .8], [5.1, 6.1, 2.607, .5]]) add(g, plane(.14, h), M.rust, [x, y, z]);
}

/* ---- DY_StrawBundles ---- */
{
  const g = grp('DY_StrawBundles');
  const strand = (s, m, p, d, len, r = .007) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r * .7, len, 3, 1, true), m); o.position.copy(p); orient(o, d); s.add(o); };
  const bundle = (pos, rot, L, R, mats, n = 220, wet = false) => {
    const s = new THREE.Group(); s.position.set(...pos); s.rotation.set(...rot); g.add(s);
    add(s, cylG(R * .82, R * .82, L * .9, 14), mats[0]);
    for (let i = 0; i < n; i++) { const a = rnd() * TAU, rad = R * Math.sqrt(rnd()) * .98, x = rad * Math.cos(a), z = rad * Math.sin(a);
      const d = new V3(x * rr(.05, .25), 1, z * rr(.05, .25)).add(new V3(rr(-.05, .05), 0, rr(-.05, .05))).normalize();
      strand(s, mats[i % mats.length], new V3(x, rr(-.06, .06), z), d, L * rr(.86, 1.08), wet ? .008 : .007); }
    for (const yy of [-L * .22, L * .22]) add(s, new THREE.TorusGeometry(R * .84, .022, 6, 20).rotateX(Math.PI / 2), M.twine, [0, yy, 0]);
  };
  const H = Math.PI / 2;
  bundle([-7.18, 9.7, -.05], [H, 0, .12], 1.1, .3, [M.strawWetA, M.strawWetB], 220, true);
  bundle([-6.78, 9.78, .1], [H, .25, -.1], 1.1, .3, [M.strawWetB, M.strawWetA], 220, true);
  const yTop = x => 2.05 + (x - 5.0) * -.25, sl = Math.atan(.25);
  bundle([6.45, yTop(6.45) + .29, 0], [H, 0, -sl], .95, .27, [M.strawDryA, M.strawDryB], 200);
  bundle([7.2, yTop(7.2) + .29, .02], [H, .12, -sl], .95, .27, [M.strawDryB, M.strawDryA], 200);
  const scatter = (cx, cz, sx, sz, n, y = .31, m = [M.strawDryA, M.strawDryB]) => { for (let i = 0; i < n; i++) { const a = rnd() * TAU, p = new V3(cx + rr(-sx, sx), y, cz + rr(-sz, sz)); strand(g, m[i % 2], p, new V3(Math.cos(a), rr(-.03, .03), Math.sin(a)), rr(.12, .4), .006); } };
  scatter(7.0, 1.6, .5, .45, 40); scatter(7.0, -1.6, .5, .45, 30); scatter(-7.1, 1.7, .45, .4, 30, .31, [M.strawWetA, M.strawWetB]); scatter(-7.2, -1.6, .4, .5, 20, .31, [M.strawWetA, M.strawWetB]);
  scatter(0, 5.6, 4, .9, 50); scatter(5.5, -1.5, .6, 1.0, 18, 7.645); scatter(-.2, 4.05, 4, .5, 24, 3.405);
}

/* ---- DY_Emissive / DY_Glass ---- */
{
  const g = grp('DY_Emissive'), fz1 = 4.7 + 1.6;
  add(g, plane(.37, .17), M.fire, [-6.43, 1.98, fz1 + .132]);
  add(g, plane(.5, .03), M.fire, [-6.45, .62, fz1 + .052]);
  add(g, plane(.42, .28), M.screen, [6.15, 1.85, 5.25 + .302]);
  [[M.lampG, 5.95], [M.lampA, 6.15], [M.lampR, 6.35]].forEach(([m, x]) => add(g, alongZ(new THREE.SphereGeometry(.035, 12, 6, 0, TAU, 0, Math.PI / 2)), m, [x, 1.45, 5.25 + .31]));
  const gl = grp('DY_Glass');
  for (const p of [[-6.125, 6.08, 3.36], [-6.125, 7.3, 2.7], [5.0, 6.9, 2.7]]) add(gl, new THREE.CircleGeometry(.118, 28), M.glass, [p[0], p[1], p[2] + .046]);
}

/* ================= merge each DY_ group into one game mesh ================= */
function mergeGroup(grpObj) {
  grpObj.updateMatrixWorld(true); const inv = grpObj.matrixWorld.clone().invert(), byMat = new Map();
  grpObj.traverse(o => { if (!o.isMesh) return; let geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    if (!geo.attributes.normal) geo.computeVertexNormals(); if (!geo.attributes.uv) geo.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(geo.attributes.position.count * 2), 2));
    geo.applyMatrix4(inv.clone().multiply(o.matrixWorld)); const sc = o.material.userData.uvScale || 1;
    if (sc !== 1) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sc, uv.getY(i) * sc); }
    if (!byMat.has(o.material)) byMat.set(o.material, []); byMat.get(o.material).push(geo); });
  let total = 0; for (const l of byMat.values()) for (const gg of l) total += gg.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2), out = new THREE.BufferGeometry(), mats = [];
  let off = 0, mi = 0;
  for (const [m, l] of byMat) { const start = off; for (const gg of l) { const n = gg.attributes.position.count; pos.set(gg.attributes.position.array, off * 3); nor.set(gg.attributes.normal.array, off * 3); uv.set(gg.attributes.uv.array.subarray(0, n * 2), off * 2); off += n; } out.addGroup(start, off - start, mi++); mats.push(m); }
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.computeBoundingBox(); out.computeBoundingSphere();
  const mesh = new THREE.Mesh(out, mats.length === 1 ? mats[0] : mats); mesh.name = grpObj.name; mesh.position.copy(grpObj.position); mesh.quaternion.copy(grpObj.quaternion); return mesh;
}
const model = new THREE.Group(); model.name = 'Dryer_v2';
const meshes = {};
for (const [name, g] of Object.entries(parts)) { if (name.startsWith('_')) continue; const m = mergeGroup(g); meshes[name] = m; model.add(m); }
const drum = meshes.DY_Drum; drum.rotation.order = 'ZYX'; drum.rotation.set(0, 0, -TILT);

/* ================= viewer environment ================= */
{
  const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.BoxGeometry(60, 30, 60), new THREE.MeshBasicMaterial({ color: new THREE.Color(.42, .43, .44), side: THREE.BackSide })));
  const panel = (w, h, c, p, r) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c, c, c * .98), side: THREE.DoubleSide })); m.position.set(...p); m.rotation.set(...r); env.add(m); };
  panel(30, 30, 4, [0, 14, 0], [Math.PI / 2, 0, 0]); panel(20, 10, 1.6, [28, 6, 10], [0, -Math.PI / 2, 0]); panel(20, 10, 1.0, [-28, 6, -8], [0, Math.PI / 2, 0]);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, .04).texture; scene.environmentIntensity = .6;
  stage._ground.material = new THREE.MeshStandardMaterial({ color: 0xa9aaa6, roughness: .95 });
  stage._key.position.set(10, 16, 9); stage._key.intensity = 2.4;
}
stage.setObject(model);
document.getElementById('busy').remove();

/* ================= report, helpers, views ================= */
const box = new THREE.Box3().setFromObject(model, true), sz = box.getSize(new V3());
const f = n => n.toFixed(3);
document.getElementById('bbox').innerHTML = `size ${f(sz.x)} × ${f(sz.y)} × ${f(sz.z)}<br>min (${f(box.min.x)}, ${f(box.min.y)}, ${f(box.min.z)})<br>max (${f(box.max.x)}, ${f(box.max.y)}, ${f(box.max.z)})`;
let tot = 0; const rows = Object.values(meshes).map(m => { const t = m.geometry.attributes.position.count / 3; tot += t; return `<tr><td>${m.name}</td><td class="${t > 20000 ? 'bad' : ''}">${t.toLocaleString()}</td></tr>`; });
document.getElementById('tris').innerHTML = rows.join('') + `<tr><td style="padding-top:4px;font-weight:600">Total (${Object.keys(meshes).length} meshes)</td><td style="padding-top:4px;font-weight:600">${tot.toLocaleString()}</td></tr>`;
window.__view = k => { const [p, t] = VIEWS[k]; cam.position.set(...p); ctl.target.set(...t); ctl.update(); };
window.__dryer = { box, tot, meshes: Object.fromEntries(Object.values(meshes).map(m => [m.name, m.geometry.attributes.position.count / 3])) };

const helpers = new THREE.Group(); helpers.visible = false; scene.add(helpers);
const portMat = new THREE.MeshBasicMaterial({ color: 0xf2c200, transparent: true, opacity: .75 });
for (const sx of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(.3, 2, 2), portMat); p.position.set(sx * 8.2, 1.5, 0); helpers.add(p); const gapBox = new THREE.Box3Helper(new THREE.Box3(new V3(sx > 0 ? 7 : -8, 0, -1.25), new V3(sx > 0 ? 8 : -7, 3, 1.25)), 0xd08a00); helpers.add(gapBox); }
const steam = new THREE.Mesh(new THREE.SphereGeometry(.12, 16, 8), new THREE.MeshBasicMaterial({ color: 0x3fa9f5 })); steam.position.set(5.6, 11.7, -1.2); helpers.add(steam);
const bbHelp = new THREE.Box3Helper(new THREE.Box3(new V3(-8, 0, -7), new V3(8, 12, 7)), 0x1f6f6c); bbHelp.visible = false; scene.add(bbHelp);

let spin = true, last = performance.now();
const tick = now => { const dt = Math.min(.05, (now - last) / 1000); last = now; if (spin) drum.rotation.x += dt * TAU * 4 / 60; requestAnimationFrame(tick); }; requestAnimationFrame(tick);
const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }; };
toggle('spinBtn', on => spin = on); toggle('portBtn', on => helpers.visible = on); toggle('boxBtn', on => bbHelp.visible = on);
document.getElementById('minBtn').onclick = e => { const p = document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent = p.classList.contains('min') ? 'show' : 'hide'; };

const cam = stage._camera, ctl = stage._controls;
const VIEWS = { 'Front ¾': [[15, 10, 18], [0, 4.6, 0]], 'Back ¾': [[-16, 10, -17], [0, 4.6, 0]], 'Top': [[0, 30, .01], [0, 0, 0]], 'Feed end': [[-15, 7, 8], [-6.4, 4.6, .8]], 'Drive train': [[6.5, 4.5, -10.5], [1.3, 2.6, -2.8]] };
const vw = document.getElementById('views'); let anim = null;
for (const [k, [p, t]] of Object.entries(VIEWS)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => {
  const p0 = cam.position.clone(), t0 = ctl.target.clone(), p1 = v3(p), t1 = v3(t), st = performance.now(); ctl.autoRotate = false; cancelAnimationFrame(anim);
  const step = now => { const u = Math.min(1, (now - st) / 700), e = u * u * (3 - 2 * u); cam.position.lerpVectors(p0, p1, e); ctl.target.lerpVectors(t0, t1, e); ctl.update(); if (u < 1) anim = requestAnimationFrame(step); }; anim = requestAnimationFrame(step); };
  vw.appendChild(b); }
cam.position.set(...VIEWS['Front ¾'][0]); ctl.target.set(...VIEWS['Front ¾'][1]); ctl.update();
</script>
